[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openlakeforge-project-code"
version = "0.3.0"
description = "OpenLakeForge project-code runtime package."
requires-python = ">=3.12,<3.13"
dependencies = [
  # dlt[s3] loads Bronze through s3fs, whose aiobotocore caps botocore below
  # 1.43.118; raise this pin only with an aiobotocore that accepts it.
  "boto3==1.43.117",
  # s3fs pulls aiohttp in; 3.14.4 fixes CVE-2026-111064, CVE-2026-111066 and
  # GHSA-2g87-pp6c-29x5.
  "aiohttp>=3.14.4",
  "dagster==1.13.7",
  "dagster-aws==0.29.7",
  "dagster-dbt==0.29.7",
  "dagster-floe[floe]==0.4.2",
  "dagster-k8s==0.29.7",
  "dagster-postgres==0.29.7",
  "dagster-webserver==1.13.7",
  "dbt-trino==1.10.2",
  "dlt[s3]>=1.17,<2",
  "floe-python==0.8.4",
  # Keep grpc health-check protobuf gencode compatible with Dagster's protobuf<7
  # runtime constraint.
  "grpcio-health-checking<1.77",
  "kubernetes<36",
  "openlineage-dbt==1.45.0",
  "pyOpenSSL==26.3.0",
]

[tool.setuptools.packages.find]
include = ["lakehouse_code*", "libs*"]
