[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openlakeforge-project-code"
version = "0.3.0"
description = "OpenLakeForge project-code runtime package."
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.43.120",
  "dagster==1.13.7",
  "dagster-aws==0.29.7",
  "dagster-dbt==0.29.7",
  "dagster-floe[floe]==0.3.0",
  "dagster-k8s==0.29.7",
  "dagster-postgres==0.29.7",
  "dagster-webserver==1.13.7",
  "dbt-trino==1.10.2",
  "dlt>=1.17,<2",
  "floe-python==0.8.0",
  # Keep grpc health-check protobuf gencode compatible with Dagster's protobuf<7
  # runtime constraint.
  "grpcio-health-checking<1.77",
  "kubernetes<36",
  "openlineage-dbt==1.45.0",
  "pyOpenSSL==26.3.0",
]

[project.scripts]
# The entrypoint of each domain's Floe Kubernetes Job (libs/floe_profile.py).
olf-floe-job = "libs.floe_job:main"

[tool.setuptools.packages.find]
include = ["lakehouse_code*", "libs*"]
