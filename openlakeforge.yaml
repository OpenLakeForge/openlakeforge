apiVersion: openlakeforge.io/v1alpha1
kind: DeploymentProfile

metadata:
  name: openlakeforge

spec:
  provider:
    type: local
  preset: slim
  stages:
    dev:
      enabled: true
  # Plain HTTP on *.olf.localhost: no certificate step (ADR 0013). Remove
  # `issuer: none` for the HTTPS stack (`olf access trust`).
  access:
    issuer: none
  # Sign-in through GitHub and Dex. Run `olf github connect` to create the
  # GitHub App and its Secret (docs/setup/github-oauth-app.md; manual OAuth App is the fallback):
  # (`olf deploy` asks for the GitHub confirmation itself when the Secret is missing.)
  # identity:
  #   issuer: github
  #   github:
  #     organization: <your-org>
  #     teams:
  #       platform-admin: [<team-slug>]
  #     oauth_app_secret_ref:
  #       name: github-oauth-app
