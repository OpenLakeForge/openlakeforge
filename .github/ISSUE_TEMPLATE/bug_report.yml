name: Bug Report
description: File a bug report to help us improve OpenLakeForge
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        **⚠️ Security Warning:** Do NOT paste tokens, credentials, Terraform state, or unredacted diagnostics. Redact any sensitive information before submitting.

  - type: input
    id: olf-version
    attributes:
      label: olf version
      description: Output of `olf version` or commit hash if running from source
      placeholder: "e.g., 0.6.0, or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      description: Which operating system are you using?
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Other (specify in description)
    validations:
      required: true

  - type: input
    id: installation-method
    attributes:
      label: Installation Method
      description: How did you install OpenLakeForge?
      placeholder: "e.g., from source, release binary, package manager"
    validations:
      required: true

  - type: input
    id: provider-preset-stage
    attributes:
      label: Provider / Preset / Stage
      description: If applicable, specify the provider (local/AWS/Azure), preset (slim/full), and stage name
      placeholder: "e.g., local/slim/dev, AWS/full/prod"
    validations:
      required: false

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the bug. Include commands, configuration, and any relevant context.
      placeholder: |
        1. Run command `olf ...`
        2. Observe error ...
        3. Expected X but got Y
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected outcome
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually occurred, including any error messages
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If applicable, paste relevant logs here. **Remember to redact sensitive information.**
        Tip: Use `olf infra diagnostics collect` for local deployments.
      placeholder: |
        Paste redacted logs here
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context about the problem (related issues, workarounds tried, etc.)
    validations:
      required: false

  - type: checkboxes
    id: acknowledgments
    attributes:
      label: Acknowledgments
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have redacted any sensitive information from logs and configuration
          required: true
        - label: I have read the [contribution guidelines](../AGENTS.md)
          required: false
