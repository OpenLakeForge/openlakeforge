name: Repository checks

on:
  pull_request:
  # The merge queue re-runs the required checks on the queued merge result;
  # without this trigger a queued pull request waits for checks that never start.
  merge_group:
  push:
    branches:
      - main

jobs:
  structure:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Check repository structure
        run: uv run --project tools/olf --locked olf check structure

  infrastructure:
    name: Validate infrastructure contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Cache OpenLakeForge toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.openlakeforge
          key: olf-toolchain-${{ hashFiles('release/component-catalog.yaml') }}

      - name: Provision OpenLakeForge toolchain
        run: uv run --project tools/olf --locked olf toolchain install

      - name: Check immutable release inputs
        run: uv run --project tools/olf --locked olf check components

      - name: Check Terraform and Helm
        run: uv run --project tools/olf --locked olf check infra

  contracts:
    name: Validate provider contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Check provider contract compatibility
        run: uv run --project tools/olf --locked olf check contracts

  project-code:
    name: Validate project-code runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Check project-code package
        run: uv run --project tools/olf --locked olf check project-code

      - name: Build project-code image
        run: uv run --project tools/olf --locked olf images build project-code

  tooling:
    name: Validate deployment tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Sync tooling environment
        run: uv sync --project tools/olf

      - name: Lint tooling
        run: uv run --project tools/olf ruff check tools/olf

      # The path is explicit because this job runs from the repository root,
      # where the config's own relative `files` entry does not resolve.
      - name: Type-check tooling
        run: >
          uv run --project tools/olf mypy
          --config-file tools/olf/pyproject.toml tools/olf/olf

      # `--cov-config` is required: this job runs from the repository root, and
      # without it coverage never finds the config, silently drops to line-only
      # measurement, and enforces no threshold.
      - name: Test tooling
        run: >
          uv run --project tools/olf pytest tools/olf/tests
          --cov --cov-config=tools/olf/pyproject.toml

  dbt:
    name: Validate product dbt projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Check product dbt projects
        run: uv run --project tools/olf --locked olf check dbt

  release-check:
    name: Validate release readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Cache OpenLakeForge toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.openlakeforge
          key: olf-toolchain-${{ hashFiles('release/component-catalog.yaml') }}

      - name: Provision OpenLakeForge toolchain
        run: uv run --project tools/olf --locked olf toolchain install

      - name: Validate release readiness (catches drift before a tag is cut)
        run: uv run --project tools/olf --locked olf check all

  kind-smoke:
    name: Deploy slim kind smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The smoke command has its own 45-minute deployment deadline. Reserve
    # another 15 minutes for runner setup and failure diagnostics/uploads.
    timeout-minutes: 60
    env:
      CLUSTER_NAME: openlakeforge-pr-${{ github.run_id }}
      KUBE_CONTEXT: kind-openlakeforge-pr-${{ github.run_id }}
      LOCAL_KUBECONFIG_PATH: ${{ github.workspace }}/.tmp/kubeconfigs/kind-smoke.yaml
      KUBECONFIG: ${{ github.workspace }}/.tmp/kubeconfigs/kind-smoke.yaml
      PROJECT_CODE_IMAGE_TAG: local

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Cache OpenLakeForge toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.openlakeforge
          key: olf-toolchain-${{ hashFiles('release/component-catalog.yaml') }}

      - name: Provision OpenLakeForge toolchain
        run: uv run --project tools/olf --locked olf toolchain install

      - name: Deploy and validate slim smoke (45 minute budget)
        run: uv run --project tools/olf --locked olf smoke run

      - name: Collect kind diagnostics
        if: failure()
        run: uv run --project tools/olf --locked olf diagnostics collect .tmp/kind-smoke-diagnostics

      - name: Upload kind diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kind-smoke-diagnostics-${{ github.run_id }}
          path: .tmp/kind-smoke-diagnostics
          if-no-files-found: error
          retention-days: 14
