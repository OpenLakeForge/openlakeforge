name: Local full e2e (nightly and manual)

# Fresh local end-to-end validation, nightly on the default branch and on
# demand for any branch.
#
# Issue #60 scoped the full local e2e suite as a main/nightly gate. Issue
# #208 widened it to prove v0.3's actual product: a project revision built
# once, activated in DEV, validated with the full assertion suite, promoted
# unchanged to PROD, and validated there too -- the developer lifecycle
# `docs/setup/local.md`'s "Promote a project revision between stages" section
# documents. The schedule below is that gate; the dispatch trigger
# additionally lets a maintainer select any branch in the UI, or a DEV-only
# run for faster iteration, from GitHub Actions instead of a local machine.
#
# The job runs the supported `olf` lifecycle and e2e commands directly, and
# reuses the kind-smoke plumbing from checks.yml (managed-toolchain
# provisioning, `olf diagnostics collect` on failure).
#
# 'smoke' (workflow_dispatch only) keeps the old single-stage `olf deploy`
# shortcut for a fast inner loop. 'full' (the nightly default) drives the
# multi-stage promotion lifecycle end to end against a DEV+PROD full-preset
# profile: Polaris namespaces, Dagster product pipelines, Silver and Gold
# tables, Polaris restart recovery, Superset dashboards, OpenMetadata assets,
# ops-bucket artifacts, and cross-stage isolation -- discovered dynamically
# from the domain inventory, run once per stage from that stage's own Bronze.
#
# Promoting a revision needs a real container registry: `olf project build`
# rejects a mutable tag, and a kind-only image has no pullable digest to
# identify an immutable revision by (see the `_DIGEST_TAG_PATTERN` gate in
# `olf.project_revision` and docs/setup/local.md's promotion walkthrough).
# This job pushes the nightly project-code image to this repository's own
# GHCR namespace, under its own package name (`project-code-nightly`, never
# `release.yml`'s `project-code`) and a fixed `nightly` tag: reusing one tag
# bounds the *tagged* history to a single image, at the cost of leaving each
# night's previous digest around as an untagged package version with no
# automatic cleanup. GHCR's own retention settings are the fix for that if
# the package grows unmanageably -- not deployment machinery, so it is left
# to the maintainer rather than built here.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: >
          Suite to run. 'full' applies a DEV+PROD full-preset Deployment
          Profile and drives the whole build-once/promote/validate lifecycle
          (see the job's own comment above). 'smoke' deploys the checked-in
          slim single-stage profile and validates one product pipeline
          through a queryable Gold table.
        type: choice
        options:
          - full
          - smoke
        default: full
      stage_scope:
        description: >
          'full' suite only. 'dev+prod' (default) runs the whole promotion
          lifecycle; 'dev-only' still builds and pushes the project-code
          image to GHCR (DEV's own activation needs that digest too) and
          runs DEV's full suite, but skips the PROD activation and its full
          suite -- for a faster maintainer-triggered check that doesn't pay
          for promotion.
        type: choice
        options:
          - dev+prod
          - dev-only
        default: dev+prod
      timeout_minutes:
        description: >
          Hard wall-clock budget for the whole job. Measured baseline for one
          stage was 25m33s (18m15s deploy, 7m02s suite); the DEV+PROD
          lifecycle adds a second stage's platform, one revision build/push,
          two activations, and a second full suite -- projected at 60-90
          minutes. 180 keeps roughly 2x headroom over that projection while
          staying well clear of the 6-hour hard limit GitHub-hosted runners
          enforce (a single job that cannot be split -- the kind cluster does
          not survive a job boundary). Raise it if a real run needs more.
        type: number
        default: 180
      debug_fail_after_deploy:
        description: >
          Negative test: fail the job right after the platform is deployed to
          prove the failure diagnostics and artifact retention work on a
          broken deployment. Defaults to false.
        type: boolean
        default: false
  schedule:
    # 02:00 UTC nightly against the default branch. `checks.yml`'s kind-smoke
    # covers one product per pull request; this is the only scheduled run of
    # the full assertion suite, so a runtime regression that static checks
    # cannot see is dated to a single day of merges instead of surfacing at
    # release time. Every `inputs.*` below is null on this trigger and falls
    # back to its dispatch default -- the nightly always runs the full
    # DEV+PROD lifecycle.
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  # One run per branch at a time; a new dispatch or nightly trigger waits for
  # the previous one instead of cancelling it, so a branch's result is never
  # ambiguous.
  group: local-full-e2e-${{ github.ref }}
  cancel-in-progress: false

# CLUSTER_NAME/KUBE_CONTEXT/LOCAL_KUBECONFIG_PATH/KUBECONFIG are deliberately
# NOT set here: they are smoke-only values (a run-scoped cluster,
# `--cluster-name`'s only caller). `olf e2e run -f` gives an ambient
# KUBECONFIG/KUBE_CONTEXT precedence over the profile it resolves
# (`commands/e2e.py::_resolve_kubeconfig_path` -- deliberate, so an installed
# distribution can override it), so a job-level value here would leak into
# the full path's e2e steps and point them at a cluster `platform apply -f`
# never created (the smoke one) instead of the one it did (the tool's own
# `openlakeforge-local` default). Every step that needs one of these values
# sets it itself, scoped to only the steps that share a cluster.
env:
  PROJECT_CODE_IMAGE_TAG: local
  # The full suite's external project: created by `olf init`, outside the
  # checkout, the way a consumer's project is (#119).
  PROJECT_DIR: ${{ github.workspace }}/../lakehouse-project

jobs:
  e2e:
    name: Deploy and validate local stack (${{ inputs.suite || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 180) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Cache OpenLakeForge toolchain
        # Managed binaries only: the installed olf keeps Terraform state, with
        # generated Secret values, under ~/.openlakeforge/state.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.openlakeforge/toolchains
          key: olf-toolchains-${{ hashFiles('release/component-catalog.yaml') }}

      - name: Provision OpenLakeForge toolchain
        run: uv run --project tools/olf --locked olf toolchain install

      # ---- smoke: the old single-stage fast inner loop ----

      - name: Deploy the local stack (smoke, fresh foundation)
        if: (inputs.suite || 'full') == 'smoke'
        env:
          CLUSTER_NAME: openlakeforge-e2e-${{ github.run_id }}
          LOCAL_KUBECONFIG_PATH: ${{ github.workspace }}/.tmp/kubeconfigs/local-e2e.yaml
        run: uv run --project tools/olf --locked olf deploy --provider local --cluster-name ${{ env.CLUSTER_NAME }} --kubeconfig-path ${{ env.LOCAL_KUBECONFIG_PATH }}

      - name: Negative-test failure injection (smoke)
        if: (inputs.suite || 'full') == 'smoke' && inputs.debug_fail_after_deploy == 'true'
        run: |
          echo "::error::debug_fail_after_deploy was set -- failing after deploy" \
            "to prove diagnostics retention on a broken deployment."
          exit 1

      - name: Run the local e2e suite (smoke)
        if: (inputs.suite || 'full') == 'smoke'
        # `olf e2e run -f` prefers an ambient KUBECONFIG/KUBE_CONTEXT over the
        # profile it resolves, so these have to name the cluster the smoke
        # deploy step above actually created.
        env:
          KUBE_CONTEXT: kind-openlakeforge-e2e-${{ github.run_id }}
          KUBECONFIG: ${{ github.workspace }}/.tmp/kubeconfigs/local-e2e.yaml
        run: uv run --project tools/olf --locked olf e2e run --env local -f openlakeforge.yaml --suite smoke

      # ---- full: build once, activate DEV, validate, promote to PROD, validate ----
      #
      # Driven the way a consumer drives it (#119): `olf` is the wheel built
      # from this commit and installed outside the checkout, the project is
      # one `olf init` created in its own directory, and the revision is built
      # and promoted by the same composite actions a project repository's CI
      # uses (.github/actions, docs/reference/ci-cd.md). After the platform is
      # applied, every step reads the provider contract from the file
      # `olf platform contract` exported, as a CI runner without the
      # platform's Terraform state would.

      - name: Build and install the openlakeforge wheel
        if: (inputs.suite || 'full') != 'smoke'
        run: |
          set -euo pipefail
          uv build --out-dir dist/python/domain-model packages/domain-model
          uv build --out-dir dist/python/openlakeforge tools/olf
          wheel="$(ls dist/python/openlakeforge/openlakeforge-*.whl)"
          version="$(basename "${wheel}" | cut -d- -f2)"
          uv tool install --find-links dist/python/domain-model --find-links dist/python/openlakeforge \
            "openlakeforge==${version}" --python 3.12
          echo "$(uv tool dir --bin)" >> "${GITHUB_PATH}"
          # An installed olf keeps its state, and the kind kubeconfig, under
          # OLF_HOME (default ~/.openlakeforge), not in any checkout.
          echo "OLF_KUBECONFIG=${HOME}/.openlakeforge/state/local/kubeconfig.yaml" >> "${GITHUB_ENV}"

      - name: Initialise an external project with the DEV+PROD Deployment Profile
        # The profile is the checked-in `openlakeforge.conformance.yaml`,
        # verbatim (#220): the profile the unit conformance suite resolves is
        # the one this job renders and applies. 'dev-only' drops its PROD
        # stage (a missing stage is disabled).
        if: (inputs.suite || 'full') != 'smoke'
        run: |
          set -euo pipefail
          mkdir -p "${PROJECT_DIR}"
          cd "${PROJECT_DIR}"
          olf version --json
          olf init
          cp "${GITHUB_WORKSPACE}/openlakeforge.conformance.yaml" openlakeforge.yaml
          if [ "${{ inputs.stage_scope || 'dev+prod' }}" = "dev-only" ]; then
            sed -i '/^    prod:$/,/^      enabled: true$/d' openlakeforge.yaml
          fi
          olf profile validate --project .
          olf project validate --project . > /dev/null
          cat openlakeforge.yaml

      - name: Apply the local platform (foundation + prefetch + platform, every enabled stage)
        if: (inputs.suite || 'full') != 'smoke'
        working-directory: ${{ env.PROJECT_DIR }}
        run: olf platform apply -f openlakeforge.yaml

      - name: Export the provider contract and check it against the conformance fixture
        # The unit conformance suite's fixture
        # (tools/olf/tests/fixtures/conformance-provider-contracts.json) is
        # this output; refresh it from the rendered-provider-contract artifact
        # when the local root's derivation changes. It carries Secret names,
        # never credentials.
        if: (inputs.suite || 'full') != 'smoke'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.tmp/rendered-contract"
          contract="${GITHUB_WORKSPACE}/.tmp/rendered-contract/provider-contracts.json"
          olf platform contract -f openlakeforge.yaml > "${contract}"
          grep -q '"stages"' "${contract}"
          if [ "${{ inputs.stage_scope || 'dev+prod' }}" != "dev-only" ]; then
            python3 -c "import json, sys; sys.exit(json.load(open(sys.argv[1])) != json.load(open(sys.argv[2])))" \
              "${contract}" "${GITHUB_WORKSPACE}/tools/olf/tests/fixtures/conformance-provider-contracts.json" \
              || { echo "::error::the rendered contract differs from tools/olf/tests/fixtures/conformance-provider-contracts.json; refresh it from this run's rendered-provider-contract artifact"; exit 1; }
          fi
          echo "OPENLAKEFORGE_PROVIDER_CONTRACTS_FILE=${contract}" >> "${GITHUB_ENV}"

      - name: Upload the rendered provider contract
        if: (inputs.suite || 'full') != 'smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-provider-contract-${{ github.run_id }}
          path: .tmp/rendered-contract
          if-no-files-found: error
          retention-days: 14

      - name: Negative-test failure injection (full)
        if: (inputs.suite || 'full') != 'smoke' && inputs.debug_fail_after_deploy == 'true'
        run: |
          echo "::error::debug_fail_after_deploy was set -- failing after platform apply" \
            "to prove diagnostics retention on a broken deployment."
          exit 1

      - name: Log in to GHCR
        if: (inputs.suite || 'full') != 'smoke'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the project-code image repository
        # A promotable revision needs a registry digest, and local stands up
        # no registry of its own (docs/setup/local.md, "Promote a project
        # revision between stages"): push to this repository's own GHCR
        # namespace. Registry names must be lowercase and the owner
        # (OpenLakeForge) is not.
        if: (inputs.suite || 'full') != 'smoke'
        id: registry
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}/project-code-nightly" >> "${GITHUB_OUTPUT}"

      - name: Build the project revision
        if: (inputs.suite || 'full') != 'smoke'
        id: revision
        uses: ./.github/actions/build-revision
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        with:
          profile: ${{ env.PROJECT_DIR }}/openlakeforge.yaml
          image-repository: ${{ steps.registry.outputs.repository }}
          image-tag: nightly

      - name: Activate the revision in DEV and run the full e2e suite there
        # `olf e2e run -f` prefers an ambient KUBECONFIG/KUBE_CONTEXT over the
        # profile it resolves (commands/e2e.py::_resolve_kubeconfig_path), so
        # these name the cluster `platform apply -f` created.
        if: (inputs.suite || 'full') != 'smoke'
        uses: ./.github/actions/deploy-stage
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        with:
          profile: ${{ env.PROJECT_DIR }}/openlakeforge.yaml
          stage: dev
          revision: ${{ steps.revision.outputs.revision }}
          e2e-env: local

      # v0.3 release gate: promotion copies no lakehouse data. PROD's Bronze,
      # Silver and Gold buckets are listed (key and ETag) before and after
      # activation and must not change -- PROD computes its data later, from
      # its own Bronze, in its own suite. Names alone could not show this for
      # Bronze, whose keys are deterministic and loaded alike in every stage.
      # The listing is test instrumentation, so it runs from the checkout.

      - name: Snapshot PROD's lakehouse buckets before promotion
        if: (inputs.suite || 'full') != 'smoke' && (inputs.stage_scope || 'dev+prod') != 'dev-only'
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: uv run --project tools/olf --locked python -c "import json; from olf import contracts; from olf.e2e._isolation import stage_bucket_objects; print(json.dumps(stage_bucket_objects(contracts.load_provider_contracts('unused'), 'prod', ('bronze', 'silver', 'gold'), namespace='olf-system'), indent=1, sort_keys=True))" > prod-buckets-before-promotion.json

      - name: Activate the same revision in PROD (promotion -- no rebuild)
        if: (inputs.suite || 'full') != 'smoke' && (inputs.stage_scope || 'dev+prod') != 'dev-only'
        uses: ./.github/actions/deploy-stage
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        with:
          profile: ${{ env.PROJECT_DIR }}/openlakeforge.yaml
          stage: prod
          revision: ${{ steps.revision.outputs.revision }}

      - name: Assert promotion wrote nothing to PROD's lakehouse buckets
        if: (inputs.suite || 'full') != 'smoke' && (inputs.stage_scope || 'dev+prod') != 'dev-only'
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: |
          set -euo pipefail
          uv run --project tools/olf --locked python -c "import json; from olf import contracts; from olf.e2e._isolation import stage_bucket_objects; print(json.dumps(stage_bucket_objects(contracts.load_provider_contracts('unused'), 'prod', ('bronze', 'silver', 'gold'), namespace='olf-system'), indent=1, sort_keys=True))" > prod-buckets-after-promotion.json
          if ! diff -u prod-buckets-before-promotion.json prod-buckets-after-promotion.json; then
            echo "::error::promotion wrote to PROD's lakehouse buckets (diff above); it must copy no data"
            exit 1
          fi

      - name: Run the full e2e suite against PROD
        # `run_full` (olf.e2e._runner) includes `check_stage_isolation`
        # whenever a sibling stage namespace exists, so this run and DEV's
        # above already assert the cross-stage negative-isolation criteria
        # from each stage's own vantage point.
        if: (inputs.suite || 'full') != 'smoke' && (inputs.stage_scope || 'dev+prod') != 'dev-only'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: olf e2e run --env local -f openlakeforge.yaml --stage prod --suite full

      - name: Prove removing PROD needs the explicit destructive opt-in
        # v0.3 release gate: disabling a stage is destructive, so an ordinary
        # apply of a profile that drops PROD must be refused -- by the removal
        # guard, not by some unrelated failure -- and leave PROD in place; the
        # same apply with --allow-stage-removal must then remove it. Same
        # deployment (metadata.name), so the guard compares against what the
        # steps above applied. A platform apply reads the platform's own
        # Terraform state, never the exported DEV+PROD contract.
        if: (inputs.suite || 'full') != 'smoke' && (inputs.stage_scope || 'dev+prod') != 'dev-only'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
          OPENLAKEFORGE_PROVIDER_CONTRACTS_FILE: ""
        run: |
          set -euo pipefail
          sed '/^    prod:$/,/^      enabled: true$/d' openlakeforge.yaml > openlakeforge.dev-only.yaml
          if grep -q '^    prod:' openlakeforge.dev-only.yaml; then
            echo "::error::could not drop the PROD stage from the applied profile"
            exit 1
          fi
          apply="olf platform apply -f openlakeforge.dev-only.yaml --phase platform"
          if $apply > stage-removal-refused.log 2>&1; then
            cat stage-removal-refused.log
            echo "::error::an ordinary apply removed PROD without --allow-stage-removal"
            exit 1
          fi
          if ! grep -q -- "Re-run with --allow-stage-removal" stage-removal-refused.log; then
            cat stage-removal-refused.log
            echo "::error::the apply failed, but not on the stage-removal guard"
            exit 1
          fi
          kubectl --context "$KUBE_CONTEXT" get namespace olf-prod > /dev/null
          $apply --allow-stage-removal
          kubectl --context "$KUBE_CONTEXT" wait --for=delete namespace/olf-prod --timeout=300s

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Local ${{ inputs.suite || 'full' }} e2e -- ${{ job.status }}"
            echo ""
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Stage scope: \`${{ (inputs.suite || 'full') == 'smoke' && 'dev' || (inputs.stage_scope || 'dev+prod') }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment the result on the branch's pull request
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number // empty')"
          if [[ -n "${pr_number}" ]]; then
            gh pr comment "${pr_number}" --body \
              "Local ${{ inputs.suite || 'full' }} e2e run finished with status **${{ job.status }}** ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
          fi

      - name: Collect kind diagnostics (smoke)
        if: failure() && (inputs.suite || 'full') == 'smoke'
        env:
          KUBECONFIG: ${{ github.workspace }}/.tmp/kubeconfigs/local-e2e.yaml
        run: uv run --project tools/olf --locked olf diagnostics collect .tmp/kind-e2e-diagnostics --kube-context kind-openlakeforge-e2e-${{ github.run_id }}

      - name: Upload kind diagnostics (smoke)
        if: failure() && (inputs.suite || 'full') == 'smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kind-e2e-diagnostics-${{ github.run_id }}
          path: .tmp/kind-e2e-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Collect kind diagnostics (DEV)
        # Per-stage output directories, so a reviewer can tell which stage
        # failed without cross-referencing the job log. DEV is always
        # collected (always enabled); PROD only when the profile enabled it,
        # so a `dev-only` run never produces an empty, misleading `prod/`
        # directory for a namespace that was never created. `platform apply
        # -f`/`project deploy -f` always resolve the tool's own default
        # cluster/kubeconfig (they take no override flags), so this has to
        # match that default explicitly -- `diagnostics collect` has no
        # `--kubeconfig` flag of its own, only ambient `KUBECONFIG`.
        if: failure() && (inputs.suite || 'full') != 'smoke'
        env:
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: uv run --project tools/olf --locked olf diagnostics collect .tmp/local-full-e2e-diagnostics/dev --namespace olf-dev --kube-context kind-openlakeforge-local

      - name: Collect kind diagnostics (PROD)
        if: failure() && (inputs.suite || 'full') != 'smoke' && (inputs.stage_scope || 'dev+prod') != 'dev-only'
        env:
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: uv run --project tools/olf --locked olf diagnostics collect .tmp/local-full-e2e-diagnostics/prod --namespace olf-prod --kube-context kind-openlakeforge-local

      - name: Upload kind diagnostics (full)
        if: failure() && (inputs.suite || 'full') != 'smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-full-e2e-diagnostics-${{ github.run_id }}
          path: .tmp/local-full-e2e-diagnostics
          if-no-files-found: error
          retention-days: 14
