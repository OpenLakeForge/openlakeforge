name: Local full e2e (nightly and manual)

# Fresh local end-to-end validation, nightly on the default branch and on
# demand for any branch.
#
# Issue #60 scoped the full local e2e suite as a main/nightly gate. Issue
# #208 widened it to prove v0.3's actual product: a project revision built
# once, activated in DEV, validated with the full assertion suite, promoted
# unchanged to PROD, and validated there too -- the developer lifecycle
# `docs/guides/promote-dev-to-prod.md`'s "Promote by hand" section
# documents. The schedule below is that gate; the dispatch trigger
# additionally lets a maintainer select any branch in the UI, or a DEV-only
# run for faster iteration, from GitHub Actions instead of a local machine.
#
# The job runs the supported `olf` lifecycle and e2e commands directly, and
# reuses the kind-smoke plumbing from checks.yml (managed-toolchain
# provisioning, `olf infra diagnostics collect` on failure).
#
# 'smoke' (workflow_dispatch only) keeps the old single-stage `olf infra deploy`
# shortcut for a fast inner loop. 'full' (the nightly default) drives the
# multi-stage promotion lifecycle end to end against a DEV+PROD full-preset
# profile: Polaris namespaces, Dagster product pipelines, Silver and Gold
# tables, Polaris restart recovery, Superset dashboards, OpenMetadata assets,
# ops-bucket artifacts, and cross-stage isolation -- discovered dynamically
# from the domain inventory, run once per stage from that stage's own Bronze.
#
# Promoting a revision needs a real container registry: `olf infra project build`
# rejects a mutable tag, and a kind-only image has no pullable digest to
# identify an immutable revision by (see the `_DIGEST_TAG_PATTERN` gate in
# `olf.infra.project_revision` and docs/guides/promote-dev-to-prod.md).
# This job pushes the nightly project-code image to this repository's own
# GHCR namespace, under its own package name (`project-code-nightly`, never
# `release.yml`'s `project-code`) and a fixed `nightly` tag: reusing one tag
# bounds the *tagged* history to a single image, at the cost of leaving each
# night's previous digest around as an untagged package version with no
# automatic cleanup. GHCR's own retention settings are the fix for that if
# the package grows unmanageably -- not deployment machinery, so it is left
# to the maintainer rather than built here.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: >
          Suite to run. 'full' applies a DEV+PROD full-preset Deployment
          Profile and drives the whole build-once/promote/validate lifecycle
          (see the job's own comment above). 'smoke' deploys the checked-in
          slim single-stage profile and validates one product pipeline
          through a queryable Gold table.
        type: choice
        options:
          - full
          - smoke
        default: full
      profile:
        description: >
          'full' suite only. A complete Deployment Profile (YAML text) to apply
          instead of openlakeforge.conformance.yaml, e.g.
          gh workflow run local-full-e2e.yml --ref <branch> -f "profile=$(cat openlakeforge.yaml)".
          A dispatch input is the only way to hand a run a file that is not in
          the repository (inputs are strings, up to 65,535 characters). With a
          custom profile 'stage_scope' and 'access_tls' are ignored -- the
          profile decides -- and the provider-contract fixture comparison is
          skipped. The run activates dev and prod only, pushes the revision to
          its own GHCR repository and cannot run the stage drill or the
          registry pull check, so a profile that enables another stage or
          declares spec.project, or a run that asks for either, is rejected.
          The job creates only the Secrets the conformance profile names:
          github-oauth-app (client-id, client-secret) for a GitHub issuer and
          olf-e2e-alert-receiver (webhook-url) for an alert receiver. A
          profile that names others stops at the platform apply. Leave empty for the conformance profile.
        type: string
        default: ""
      profile_path:
        description: >
          'full' suite only. Same as 'profile', but the path (relative to the
          repository root, on the dispatched ref) of a profile committed to
          the branch. Set at most one of the two.
        type: string
        default: ""
      stage_scope:
        description: >
          'full' suite only, default profile only. 'dev-only' (default for manual runs) still
          builds and pushes the project-code image to GHCR (DEV's own
          activation needs that digest too) and runs DEV's full suite, but
          skips the PROD snapshot, the promotion and the PROD suite.
          'dev+prod' runs the whole promotion lifecycle; the nightly
          schedule always uses it. Only 'dev+prod' (or a custom profile that
          enables both) runs the cross-stage isolation probes: with one stage
          there is nothing to isolate against.
        type: choice
        options:
          - dev-only
          - dev+prod
        default: dev-only
      checks:
        description: >
          'full' suite only. 'core' (default for manual runs) skips the slow
          drills (restart recovery, certificate renewal, network/RBAC,
          break-glass, perimeter latency, issuer outage, log collector
          short-lived pod and restart, secret rotation).
          'all' runs them, in the DEV suite only -- PROD always runs 'core'.
          'none' deploys and activates and runs no e2e assertions in either
          stage, to leave a running platform to test a feature against. The
          lake stays empty, so it cannot be combined with restore_drill.
          The nightly schedule always uses 'all'.
        type: choice
        options:
          - none
          - core
          - all
        default: core
      registry_pull_check:
        description: >
          'full' suite only. After the suites, activate each stage again
          through an image pull Secret and prove the pull (#537). It removes
          the project image from the nodes, so it is slow, and it proves a
          mechanism that rarely changes. The nightly always runs it.
        type: boolean
        default: false
      timeout_minutes:
        description: >
          Hard wall-clock budget for the whole job. On 2026-11-24 and
          2026-11-25 the nightly reached the restore drill after about 165
          minutes (the DEV suite with its drills alone took 105-116), and the
          drill took 44 on 2026-11-15. 240 covers that with about 30 minutes
          to spare, within the 6-hour limit of a GitHub-hosted runner (the
          job cannot be split: the kind cluster does not survive a job
          boundary). Raise it if a real run needs more.
        type: number
        default: 240
      restore_drill:
        description: >
          'full' suite only. After every other step, back the deployment up,
          destroy the cluster, create the platform again, restore, and verify
          each stage against a baseline taken before the backup
          (.github/actions/restore-drill, docs/guides/backup-and-restore.md).
          Measured at 44 minutes. The nightly schedule always runs it.
        type: boolean
        default: false
      stage_drill:
        description: >
          'full' suite with PROD enabled only. After the PROD suite, redeploy three times with a changed
          profile: PROD governance off (#1049: no polaris-om-creds and no Trino crawl left in PROD), PROD disabled
          with --allow-stage-removal (#1050: its namespace and Polaris principals gone), and PROD enabled again
          (activated, the core suite passes). Then scan for Secret values (.github/actions/stage-drill).
          Estimated at 30 minutes, so it is not in the nightly. Runs before the restore drill.
        type: boolean
        default: false
      access_tls:
        description: >
          'full' suite only. 'local-ca' (default; the nightly always uses it)
          keeps the conformance profile's HTTPS routes. 'none' switches
          spec.access.tls to plain HTTP, the local default since #948, so
          a run with restore_drill proves a backup without local-ca restores
          (#958). 'external' (#990) sets spec.access.tls to external on
          base_domain olf.example.test and deploys a TLS-terminating proxy in
          front of Traefik that plays the customer's edge; the run signs in,
          queries and opens every route through it. The provider-contract
          fixture describes local-ca, so a 'none' or 'external' run skips
          that comparison.
        type: choice
        options:
          - local-ca
          - none
          - external
        default: local-ca
      debug_fail_after_deploy:
        description: >
          Negative test: fail the job right after the platform is deployed to
          prove the failure diagnostics and artifact retention work on a
          broken deployment. Defaults to false.
        type: boolean
        default: false
  schedule:
    # 02:00 UTC nightly against the default branch. `checks.yml`'s kind-smoke
    # covers one product per pull request; this is the only scheduled run of
    # the full assertion suite, so a runtime regression that static checks
    # cannot see is dated to a single day of merges instead of surfacing at
    # release time. Every `inputs.*` below is null on this trigger and falls
    # back to its dispatch default -- the nightly always runs the full
    # DEV+PROD lifecycle.
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  # One run per branch at a time; a new dispatch or nightly trigger waits for
  # the previous one instead of cancelling it, so a branch's result is never
  # ambiguous.
  group: local-full-e2e-${{ github.ref }}
  cancel-in-progress: false

# CLUSTER_NAME/KUBE_CONTEXT/LOCAL_KUBECONFIG_PATH/KUBECONFIG are deliberately
# NOT set here: they are smoke-only values (a run-scoped cluster,
# `--cluster-name`'s only caller). `olf infra e2e run -f` gives an ambient
# KUBECONFIG/KUBE_CONTEXT precedence over the profile it resolves
# (`commands/e2e.py::_resolve_kubeconfig_path` -- deliberate, so an installed
# distribution can override it), so a job-level value here would leak into
# the full path's e2e steps and point them at a cluster `platform apply -f`
# never created (the smoke one) instead of the one it did (the tool's own
# `openlakeforge-local` default). Every step that needs one of these values
# sets it itself, scoped to only the steps that share a cluster.
env:
  PROJECT_CODE_IMAGE_TAG: local
  # The release-pinned Superset image is the last published one, so a branch that changes images/superset (or the
  # Superset config that imports from it) cannot run on it: the pods crash on the missing symbol and the Helm
  # release times out. Build the image from this checkout, as a maintainer does (images/superset/README.md).
  BUILD_SUPERSET_IMAGE: "true"
  # The full suite's external project: created by `olf init`, outside the
  # checkout, the way a consumer's project is (#119).
  PROJECT_DIR: ${{ github.workspace }}/../lakehouse-project
  # The operator journey screenshots (olf.infra.e2e._walkthrough) drive Chromium through Playwright, which is
  # installed beside olf for this job only: it is not a dependency of olf.
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  e2e:
    name: Deploy and validate local stack (${{ inputs.suite || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 240) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Free runner disk for the image preload
        # Prefetch keeps each catalog image in Docker and in all three kind
        # nodes; the stock runner's free space is not enough (the #457 runs ran out of
        # disk importing Polaris). These toolchains are never used here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Raise the host's inotify limits for kind
        # Every kind node shares the runner's kernel, so all their pods draw
        # on one user's inotify instances (default 128). With DEV+PROD and the
        # metrics stack, fluent-bit's tail input failed with "Too many open
        # files" (errno 24 from inotify_init) and the pod-health check stopped
        # the run (44578422835). Values from kind's known-issues page.
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=512
          sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Cache OpenLakeForge toolchain
        # Managed binaries only: the installed olf keeps Terraform state, with
        # generated Secret values, under ~/.openlakeforge/state.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.openlakeforge/toolchains
          key: olf-toolchains-${{ hashFiles('release/component-catalog.yaml') }}

      - name: Provision OpenLakeForge toolchain
        run: uv run --project tools/olf --locked olf toolchain install

      # ---- smoke: the old single-stage fast inner loop ----

      - name: Deploy the local stack (smoke, fresh foundation)
        if: (inputs.suite || 'full') == 'smoke'
        env:
          CLUSTER_NAME: openlakeforge-e2e-${{ github.run_id }}
          LOCAL_KUBECONFIG_PATH: ${{ github.workspace }}/.tmp/kubeconfigs/local-e2e.yaml
        run: uv run --project tools/olf --locked olf infra deploy --provider local --cluster-name ${{ env.CLUSTER_NAME }} --kubeconfig-path ${{ env.LOCAL_KUBECONFIG_PATH }}

      - name: Negative-test failure injection (smoke)
        if: (inputs.suite || 'full') == 'smoke' && inputs.debug_fail_after_deploy == 'true'
        run: |
          echo "::error::debug_fail_after_deploy was set -- failing after deploy" \
            "to prove diagnostics retention on a broken deployment."
          exit 1

      - name: Run the local e2e suite (smoke)
        if: (inputs.suite || 'full') == 'smoke'
        # `olf infra e2e run -f` prefers an ambient KUBECONFIG/KUBE_CONTEXT over the
        # profile it resolves, so these have to name the cluster the smoke
        # deploy step above actually created.
        env:
          KUBE_CONTEXT: kind-openlakeforge-e2e-${{ github.run_id }}
          KUBECONFIG: ${{ github.workspace }}/.tmp/kubeconfigs/local-e2e.yaml
        run: uv run --project tools/olf --locked olf infra e2e run --env local -f openlakeforge.yaml --suite smoke

      # ---- full: build once, activate DEV, validate, promote to PROD, validate ----
      #
      # Driven the way a consumer drives it (#119): `olf` is the wheel built
      # from this commit and installed outside the checkout, the project is
      # one `olf init` created in its own directory, and the revision is built
      # and promoted by the same composite actions a project repository's CI
      # uses (.github/actions, docs/guides/promote-dev-to-prod.md). After the platform is
      # applied, every step reads the provider contract from the file
      # `olf infra platform contract` exported, as a CI runner without the
      # platform's Terraform state would.

      - name: Build and install the openlakeforge wheel
        if: (inputs.suite || 'full') != 'smoke'
        run: |
          set -euo pipefail
          uv build --out-dir dist/python/core packages/core
          uv build --out-dir dist/python/lakehouse-services packages/lakehouse-services
          uv build --out-dir dist/python/runtime packages/runtime
          uv build --out-dir dist/python/openlakeforge tools/olf
          wheel="$(ls dist/python/openlakeforge/openlakeforge-*.whl)"
          version="$(basename "${wheel}" | cut -d- -f2)"
          uv tool install --find-links dist/python/core --find-links dist/python/lakehouse-services \
            --find-links dist/python/runtime --find-links dist/python/openlakeforge "openlakeforge==${version}" --python 3.12 \
            --with "playwright==${PLAYWRIGHT_VERSION}"
          "$(uv tool dir)/openlakeforge/bin/python" -m playwright install --with-deps chromium
          echo "$(uv tool dir --bin)" >> "${GITHUB_PATH}"
          # An installed olf keeps its state, and the kind kubeconfig, under
          # OLF_HOME (default ~/.openlakeforge), not in any checkout.
          echo "OLF_KUBECONFIG=${HOME}/.openlakeforge/state/local/kubeconfig.yaml" >> "${GITHUB_ENV}"

      - name: Initialise an external project with the Deployment Profile
        # Default: the checked-in `openlakeforge.conformance.yaml`, verbatim
        # (#220): the profile the unit conformance suite resolves is the one
        # this job renders and applies. 'dev-only' drops its PROD stage (a
        # missing stage is disabled). A `profile` or `profile_path` input
        # replaces it, and then the profile alone decides the stages. Inline
        # text goes through the environment, never into the script, so a
        # profile cannot inject shell. `prod` is what every PROD step below
        # keys off, whichever way the profile arrived; a stage block that
        # omits `enabled` is enabled, as the profile loader resolves it.
        if: (inputs.suite || 'full') != 'smoke'
        id: profile
        env:
          PROFILE_YAML: ${{ inputs.profile }}
          PROFILE_PATH: ${{ inputs.profile_path }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.checks }}" = "none" ] && [ "${{ inputs.restore_drill }}" = "true" ]; then
            # The drill's baseline needs the default product's Silver and Gold tables, which only the suite's pipelines build.
            echo "::error::restore_drill needs data in the lake: use checks core or all, not none"
            exit 1
          fi
          mkdir -p "${PROJECT_DIR}"
          cd "${PROJECT_DIR}"
          olf version --json
          olf init
          custom=false
          if [ -n "${PROFILE_YAML}" ] && [ -n "${PROFILE_PATH}" ]; then
            echo "::error::set profile or profile_path, not both"
            exit 1
          elif [ -n "${PROFILE_YAML}" ]; then
            printf '%s\n' "${PROFILE_YAML}" > openlakeforge.yaml
            custom=true
          elif [ -n "${PROFILE_PATH}" ]; then
            source="$(realpath -e "${GITHUB_WORKSPACE}/${PROFILE_PATH}")"
            case "${source}" in
              "${GITHUB_WORKSPACE}"/*) ;;
              *) echo "::error::profile_path must stay inside the repository"; exit 1 ;;
            esac
            cp "${source}" openlakeforge.yaml
            custom=true
          else
            cp "${GITHUB_WORKSPACE}/openlakeforge.conformance.yaml" openlakeforge.yaml
            if [ "${{ inputs.stage_scope || 'dev+prod' }}" = "dev-only" ]; then
              sed -i '/^    prod:$/,/^      enabled: true$/d' openlakeforge.yaml
            fi
            if [ "${{ inputs.access_tls || 'local-ca' }}" = "none" ]; then
              sed -i 's/^    tls: local-ca$/    tls: none/' openlakeforge.yaml
              grep -qx '    tls: none' openlakeforge.yaml
            fi
            if [ "${{ inputs.access_tls || 'local-ca' }}" = "external" ]; then
              sed -i 's/^    tls: local-ca$/    tls: external\n    base_domain: olf.example.test\n    trusted_proxies: [10.244.0.0\/16]/' openlakeforge.yaml
              grep -qx '    tls: external' openlakeforge.yaml
              # The fixture edge is a pod, so Traefik sees it from kind's default pod CIDR.
              # The fixture edge listens on this runner (hostPort 443) and the
              # clients resolve the public name to it; it is signed by the local CA.
              echo "OLF_E2E_TEST_EDGE=1" >> "${GITHUB_ENV}"
              echo "OLF_EDGE_RESOLVE=olf.example.test=127.0.0.1" >> "${GITHUB_ENV}"
            fi
          fi
          olf profile validate --project .
          olf project validate --project . > /dev/null
          # The stages and the image source come from olf's own resolution of the profile, not a second reading of it here.
          olf profile resolve --project . --json > "${RUNNER_TEMP}/resolved-profile.json"
          prod="$(python3 -c 'import json, sys; print("true" if any(s["name"] == "prod" and s["enabled"] for s in json.load(open(sys.argv[1]))["stages"]) else "false")' "${RUNNER_TEMP}/resolved-profile.json")"
          if [ "${custom}" = "true" ]; then
            # The steps below activate dev and prod only, and they own the image repository (GHCR, with the job's token).
            python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); bad = [s["name"] for s in d["stages"] if s["enabled"] and s["name"] not in ("dev", "prod")]; sys.exit("::error::this workflow activates dev and prod only; the profile also enables " + ", ".join(bad) if bad else 0)' "${RUNNER_TEMP}/resolved-profile.json"
            python3 -c 'import json, sys; sys.exit("::error::a custom profile must not declare spec.project: the workflow pushes the revision to its own GHCR repository" if json.load(open(sys.argv[1]))["project"]["source"] == "profile" else 0)' "${RUNNER_TEMP}/resolved-profile.json"
            # Both edit the conformance profile's text (sed, and an appended `project:` block), not parsed YAML.
            if [ "${{ inputs.stage_drill }}" = "true" ] || [ "${{ inputs.registry_pull_check }}" = "true" ]; then
              echo "::error::stage_drill and registry_pull_check edit the conformance profile and do not support a custom profile"
              exit 1
            fi
          fi
          echo "custom=${custom}" >> "${GITHUB_OUTPUT}"
          echo "prod=${prod}" >> "${GITHUB_OUTPUT}"
          echo "::notice::custom profile: ${custom}; PROD stage enabled: ${prod}"
          cat openlakeforge.yaml

      - name: Apply the local platform (foundation + prefetch + platform, every enabled stage)
        # The profile selects the GitHub issuer against the e2e stub
        # (docs/guides/identity/connect-github.md), so Dex reads a `github-oauth-app`
        # Secret that `olf` does not create. A first apply makes the foundation
        # and the shared namespace, then stops at the missing Secret; the
        # dummy one below is enough because the stub never checks it. The
        # second apply is the real gate.
        if: (inputs.suite || 'full') != 'smoke'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -uo pipefail
          olf infra platform apply -f openlakeforge.yaml || echo "::notice::first apply stopped at the missing GitHub OAuth Secret, as expected"
          kubectl --kubeconfig "${OLF_KUBECONFIG}" -n olf-system create secret generic github-oauth-app \
            --from-literal=client-id=olf-e2e --from-literal=client-secret=olf-e2e \
            --dry-run=client -o yaml | kubectl --kubeconfig "${OLF_KUBECONFIG}" -n olf-system apply -f -
          # The alert receiver's webhook URL (conformance profile): the e2e's stub pod serves it.
          kubectl --kubeconfig "${OLF_KUBECONFIG}" -n olf-system create secret generic olf-e2e-alert-receiver \
            --from-literal=webhook-url=https://olf-e2e-alert-receiver.olf-system.svc/hook \
            --dry-run=client -o yaml | kubectl --kubeconfig "${OLF_KUBECONFIG}" -n olf-system apply -f -
          olf infra platform apply -f openlakeforge.yaml

      - name: Export the provider contract and check it against the conformance fixture
        # The unit conformance suite's fixture
        # (tools/olf/tests/fixtures/conformance-provider-contracts.json) is
        # this output; refresh it from the rendered-provider-contract artifact
        # when the local root's derivation changes. It carries Secret names,
        # never credentials.
        if: (inputs.suite || 'full') != 'smoke'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.tmp/rendered-contract"
          contract="${GITHUB_WORKSPACE}/.tmp/rendered-contract/provider-contracts.json"
          olf infra platform contract -f openlakeforge.yaml > "${contract}"
          grep -q '"stages"' "${contract}"
          if [ "${{ steps.profile.outputs.custom }}" = "false" ] && [ "${{ steps.profile.outputs.prod }}" = "true" ] && [ "${{ inputs.access_tls || 'local-ca' }}" = "local-ca" ]; then
            python3 -c "import json, sys; sys.exit(json.load(open(sys.argv[1])) != json.load(open(sys.argv[2])))" \
              "${contract}" "${GITHUB_WORKSPACE}/tools/olf/tests/fixtures/conformance-provider-contracts.json" \
              || { echo "::error::the rendered contract differs from tools/olf/tests/fixtures/conformance-provider-contracts.json; refresh it from this run's rendered-provider-contract artifact"; exit 1; }
          fi
          echo "OPENLAKEFORGE_PROVIDER_CONTRACTS_FILE=${contract}" >> "${GITHUB_ENV}"

      - name: Upload the rendered provider contract
        # always(): a contract that differs from the fixture is exactly when
        # this artifact is needed to refresh it.
        if: always() && (inputs.suite || 'full') != 'smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-provider-contract-${{ github.run_id }}
          path: .tmp/rendered-contract
          if-no-files-found: error
          retention-days: 14

      - name: Negative-test failure injection (full)
        if: (inputs.suite || 'full') != 'smoke' && inputs.debug_fail_after_deploy == 'true'
        run: |
          echo "::error::debug_fail_after_deploy was set -- failing after platform apply" \
            "to prove diagnostics retention on a broken deployment."
          exit 1

      - name: Log in to GHCR
        if: (inputs.suite || 'full') != 'smoke'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the project-code image repository
        # A promotable revision needs a registry digest, and local stands up
        # no registry of its own (docs/guides/promote-dev-to-prod.md, "Promote
        # by hand"): push to this repository's own GHCR
        # namespace. Registry names must be lowercase and the owner
        # (OpenLakeForge) is not.
        if: (inputs.suite || 'full') != 'smoke'
        id: registry
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}/project-code-nightly" >> "${GITHUB_OUTPUT}"

      - name: Build the project revision
        if: (inputs.suite || 'full') != 'smoke'
        id: revision
        uses: ./.github/actions/build-revision
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        with:
          profile: ${{ env.PROJECT_DIR }}/openlakeforge.yaml
          image-repository: ${{ steps.registry.outputs.repository }}
          image-tag: nightly

      - name: Activate the revision in DEV and run the full e2e suite there
        # `olf infra e2e run -f` prefers an ambient KUBECONFIG/KUBE_CONTEXT over the
        # profile it resolves (commands/e2e.py::_resolve_kubeconfig_path), so
        # these name the cluster `platform apply -f` created.
        if: (inputs.suite || 'full') != 'smoke'
        uses: ./.github/actions/deploy-stage
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        with:
          profile: ${{ env.PROJECT_DIR }}/openlakeforge.yaml
          stage: dev
          revision: ${{ steps.revision.outputs.revision }}
          e2e-env: ${{ inputs.checks != 'none' && 'local' || '' }}
          e2e-checks: ${{ inputs.checks == 'none' && 'core' || inputs.checks || 'all' }}

      # v0.3 release gate: promotion copies no lakehouse data. PROD's Bronze,
      # Silver and Gold buckets are listed (key and ETag) before and after
      # activation and must not change -- PROD computes its data later, from
      # its own Bronze, in its own suite. Names alone could not show this for
      # Bronze, whose keys are deterministic and loaded alike in every stage.
      # The listing is test instrumentation, so it runs from the checkout.

      - name: Snapshot PROD's lakehouse buckets before promotion
        if: (inputs.suite || 'full') != 'smoke' && steps.profile.outputs.prod == 'true'
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: uv run --project tools/olf --locked olf e2e stage-buckets --stage prod > prod-buckets-before-promotion.json

      - name: Activate the same revision in PROD (promotion -- no rebuild)
        if: (inputs.suite || 'full') != 'smoke' && steps.profile.outputs.prod == 'true'
        uses: ./.github/actions/deploy-stage
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        with:
          profile: ${{ env.PROJECT_DIR }}/openlakeforge.yaml
          stage: prod
          revision: ${{ steps.revision.outputs.revision }}

      - name: Assert promotion wrote nothing to PROD's lakehouse buckets
        if: (inputs.suite || 'full') != 'smoke' && steps.profile.outputs.prod == 'true'
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: |
          set -euo pipefail
          uv run --project tools/olf --locked olf e2e stage-buckets --stage prod > prod-buckets-after-promotion.json
          if ! diff -u prod-buckets-before-promotion.json prod-buckets-after-promotion.json; then
            echo "::error::promotion wrote to PROD's lakehouse buckets (diff above); it must copy no data"
            exit 1
          fi

      - name: Run the full e2e suite against PROD
        # `run_full` (olf.infra.e2e._runner) includes `check_stage_isolation`,
        # which probes every other enabled stage, so this run and DEV's above
        # together cover both ordered pairs (#251). Each writes
        # stage-isolation-<namespace>.json to the evidence uploaded below. A
        # pair whose other stage has no runs or data yet is recorded as
        # deferred in DEV's report and compared here.
        if: (inputs.suite || 'full') != 'smoke' && steps.profile.outputs.prod == 'true' && inputs.checks != 'none'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: olf infra e2e run --env local -f openlakeforge.yaml --stage prod --suite full --checks core

      - name: Report disk used by the Full DEV+PROD deployment
        # The figure docs/guides/local-installation.md#hardware publishes for
        # Full with two stages; compare with the first step's df. Taken before
        # the drills, which destroy and rebuild the platform.
        if: always() && (inputs.suite || 'full') != 'smoke'
        run: |
          df -h /
          docker system df
          # Compressed blobs against unpacked snapshots, per node (#1373).
          for node in $(docker ps --filter name=openlakeforge-local- --format '{{.Names}}'); do
            echo "$node"
            docker exec "$node" du -sh /var/lib/containerd/io.containerd.content.v1.content \
              /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs
          done

      - name: Prove the stages pull the project image through a pull Secret (#537)
        # KNOWN GAP: the check proves the mechanism, not that a private image is pullable. `project-code-nightly`
        # answers anonymous pulls (measured 2026-11-07), so `--allow-public` is required, and the Secret is built
        # from `GITHUB_TOKEN`, which expires with this job (the guide forbids that for a real cluster). The private,
        # durable-PAT case is the manual procedure in docs/guides/promote-dev-to-prod.md. The nightly profile
        # declares no `spec.project`, so it is added here for the activation and the original is put back before the
        # restore drill: that rebuilds a cluster without this Secret and would refuse to reactivate with it named.
        # Runs after the PROD suite because it removes the image from the nodes and launches a run per stage.
        # The nightly runs it; a dispatch opts in with `registry_pull_check`.
        if: (inputs.suite || 'full') != 'smoke' && (github.event_name == 'schedule' || inputs.registry_pull_check)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ steps.registry.outputs.repository }}
          REVISION: ${{ steps.revision.outputs.revision }}
          STAGES: ${{ steps.profile.outputs.prod != 'true' && 'dev' || 'dev prod' }}
        run: |
          set -euo pipefail
          cp openlakeforge.yaml "${RUNNER_TEMP}/openlakeforge.original.yaml"
          trap 'cp "${RUNNER_TEMP}/openlakeforge.original.yaml" openlakeforge.yaml' EXIT
          printf '%s\n' '  project:' '    image:' "      repository: ${IMAGE_REPOSITORY}" \
            '      pull_secret_ref:' '        name: ghcr-pull' >> openlakeforge.yaml
          olf profile validate --project .
          for stage in ${STAGES}; do
            kubectl --kubeconfig "${OLF_KUBECONFIG}" -n "olf-${stage}" create secret docker-registry ghcr-pull \
              --docker-server=ghcr.io --docker-username="${REGISTRY_USER}" --docker-password="${REGISTRY_TOKEN}" \
              --dry-run=client -o yaml | kubectl --kubeconfig "${OLF_KUBECONFIG}" apply -f - >/dev/null
            olf infra project deploy -f openlakeforge.yaml --stage "${stage}" --revision "${REVISION}"
            olf infra e2e registry-pull -f openlakeforge.yaml --stage "${stage}" --allow-public
          done

      - name: Stage drill needs a PROD stage
        if: (inputs.suite || 'full') != 'smoke' && inputs.stage_drill && steps.profile.outputs.prod != 'true'
        run: |
          echo "::error::stage_drill removes and re-enables PROD, so it needs a profile with PROD enabled"
          exit 1

      - name: Stage drill (PROD governance off, PROD removed, PROD enabled again, scan)
        # After the registry-pull step, which puts the profile back, and before the restore drill, which would
        # rebuild the cluster this drill redeploys. It rewrites the profile and puts it back at the end.
        if: (inputs.suite || 'full') != 'smoke' && inputs.stage_drill && steps.profile.outputs.prod == 'true'
        uses: ./.github/actions/stage-drill
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        with:
          profile: ${{ env.PROJECT_DIR }}/openlakeforge.yaml
          revision: ${{ steps.revision.outputs.revision }}

      - name: Restore drill (back up, destroy, rebuild the platform, restore, verify, scan)
        # Last, because it destroys the cluster the steps above used. The
        # nightly runs it; a dispatch opts in with `restore_drill`.
        if: (inputs.suite || 'full') != 'smoke' && (github.event_name == 'schedule' || inputs.restore_drill)
        uses: ./.github/actions/restore-drill
        env:
          KUBE_CONTEXT: kind-openlakeforge-local
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        with:
          profile: ${{ env.PROJECT_DIR }}/openlakeforge.yaml
          stages: ${{ steps.profile.outputs.prod != 'true' && 'dev' || 'dev prod' }}

      - name: Upload the restore drill report
        # Only the manifest and the verify reports: the backup directory
        # holds all the data in the clear and is never uploaded.
        if: always() && (inputs.suite || 'full') != 'smoke' && (github.event_name == 'schedule' || inputs.restore_drill)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-drill-report-${{ github.run_id }}
          path: .tmp/restore-drill/report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Local ${{ inputs.suite || 'full' }} e2e -- ${{ job.status }}"
            echo ""
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Stage scope: \`${{ (inputs.suite || 'full') == 'smoke' && 'dev' || (steps.profile.outputs.prod == 'true' && 'dev+prod' || 'dev-only') }}\`"
            echo "- Profile: \`${{ (inputs.suite || 'full') == 'smoke' && 'slim profile' || (steps.profile.outputs.custom == 'true' && 'custom' || 'conformance') }}\`"
            echo "- Access TLS: \`${{ (inputs.suite || 'full') == 'smoke' && 'slim profile' || steps.profile.outputs.custom == 'true' && 'from the profile' || (inputs.access_tls || 'local-ca') }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment the result on the branch's pull request
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number // empty')"
          if [[ -n "${pr_number}" ]]; then
            gh pr comment "${pr_number}" --body \
              "Local ${{ inputs.suite || 'full' }} e2e run finished with status **${{ job.status }}** ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
          fi

      - name: Stage ingress drill evidence for upload
        # upload-artifact rejects paths containing '..', and PROJECT_DIR sits
        # beside the workspace, so copy the evidence into it first.
        if: always() && (inputs.suite || 'full') != 'smoke'
        run: |
          mkdir -p .tmp/e2e-evidence
          cp -R "${PROJECT_DIR}/.tmp/e2e-evidence/." .tmp/e2e-evidence/ 2>/dev/null || true

      - name: Upload ingress drill evidence
        # Written by the full suite's Traefik restart and certificate renewal
        # drills (#268), and each stage's isolation report (#251), pass or fail.
        if: always() && (inputs.suite || 'full') != 'smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-e2e-evidence-${{ github.run_id }}
          path: .tmp/e2e-evidence
          # Every evidence file sits under the hidden .tmp directory.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Stage the walkthrough screenshots for upload
        if: always() && (inputs.suite || 'full') != 'smoke'
        run: |
          mkdir -p .tmp/walkthrough-screenshots
          cp -R "${PROJECT_DIR}/.tmp/walkthrough-screenshots/." .tmp/walkthrough-screenshots/ 2>/dev/null || true

      - name: Upload the walkthrough screenshots
        # The operator journey drill's PNGs, one directory per stage; a page that missed its state is kept as
        # <name>.FAILED.png when its secret scan is clean, so a failed run uploads what the browser showed instead.
        # Kept as long as the diagnostics, not the 90 days of the evidence above: a page is a picture of live data.
        if: always() && (inputs.suite || 'full') != 'smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: walkthrough-screenshots-${{ github.run_id }}
          path: .tmp/walkthrough-screenshots
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Collect kind diagnostics (smoke)
        if: failure() && (inputs.suite || 'full') == 'smoke'
        env:
          KUBECONFIG: ${{ github.workspace }}/.tmp/kubeconfigs/local-e2e.yaml
        run: uv run --project tools/olf --locked olf infra diagnostics collect .tmp/kind-e2e-diagnostics --kube-context kind-openlakeforge-e2e-${{ github.run_id }}

      - name: Upload kind diagnostics (smoke)
        if: failure() && (inputs.suite || 'full') == 'smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kind-e2e-diagnostics-${{ github.run_id }}
          path: .tmp/kind-e2e-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Collect kind diagnostics (DEV)
        # Per-stage output directories, so a reviewer can tell which stage
        # failed without cross-referencing the job log. DEV is always
        # collected (always enabled); PROD only when the profile enabled it,
        # so a `dev-only` run never produces an empty, misleading `prod/`
        # directory for a namespace that was never created. `platform apply
        # -f`/`project deploy -f` always resolve the tool's own default
        # cluster/kubeconfig (they take no override flags), so this has to
        # match that default explicitly -- `diagnostics collect` has no
        # `--kubeconfig` flag of its own, only ambient `KUBECONFIG`.
        if: failure() && (inputs.suite || 'full') != 'smoke'
        env:
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: uv run --project tools/olf --locked olf infra diagnostics collect .tmp/local-full-e2e-diagnostics/dev --namespace olf-dev --kube-context kind-openlakeforge-local

      - name: Collect kind diagnostics (PROD)
        if: failure() && (inputs.suite || 'full') != 'smoke' && steps.profile.outputs.prod == 'true'
        env:
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: uv run --project tools/olf --locked olf infra diagnostics collect .tmp/local-full-e2e-diagnostics/prod --namespace olf-prod --kube-context kind-openlakeforge-local

      - name: Collect kind diagnostics (shared services)
        # Polaris, Trino, OpenMetadata and their bootstrap jobs run in the
        # shared namespace, not a stage's.
        if: failure() && (inputs.suite || 'full') != 'smoke'
        env:
          KUBECONFIG: ${{ env.OLF_KUBECONFIG }}
        run: uv run --project tools/olf --locked olf infra diagnostics collect .tmp/local-full-e2e-diagnostics/shared --namespace olf-system --kube-context kind-openlakeforge-local

      - name: Upload kind diagnostics (full)
        if: failure() && (inputs.suite || 'full') != 'smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-full-e2e-diagnostics-${{ github.run_id }}
          path: .tmp/local-full-e2e-diagnostics
          if-no-files-found: error
          retention-days: 14
