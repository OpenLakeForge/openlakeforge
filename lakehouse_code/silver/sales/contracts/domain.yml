name: "sales"
defaults:
  incremental_mode: "none"
  sink:
    write_mode: "overwrite"
    accepted:
      format: "iceberg"
      path: "sales/{{entity.name}}"
      storage: "lakehouse_silver"
      iceberg: { catalog: "iceberg_catalog", namespace: "sales_silver" }
    rejected: { format: "csv", path: "floe/rejected/sales/{{entity.name}}", storage: "lakehouse_silver" }
  policy: { severity: "reject" }
  schema:
    normalize_columns: { enabled: true, strategy: "snake_case" }
