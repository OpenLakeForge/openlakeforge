name: inventory_reliability
version: "1.0.0"
config-version: 2

profile: inventory_reliability

model-paths: ["models"]
macro-paths: []
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  inventory_reliability:
    +database: "{{ env_var('OPENLAKEFORGE_CATALOG_NAME') }}"
    +materialized: table
    +on_table_exists: replace
    +meta:
      dagster:
        group: inventory_reliability
    gold:
      +tags: ["supply_chain", "inventory_reliability", "gold"]
