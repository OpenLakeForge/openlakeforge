version: 2

groups:
  - name: inventory_reliability
    owner:
      name: inventory_reliability

models:
  - name: dim_warehouse
    access: public
    description: Warehouses. One row per warehouse.
    columns:
      - name: warehouse_id
        data_type: varchar
        description: Warehouse identifier; the primary key.
        data_tests:
          - unique
          - not_null
      - name: warehouse_name
        data_type: varchar
        description: Warehouse display name.
      - name: warehouse_region
        data_type: varchar
        description: Region the warehouse is in.
      - name: capacity_units
        data_type: integer
        description: Storage capacity of the warehouse in units.
  - name: dim_supplier
    access: public
    description: Suppliers. One row per supplier.
    columns:
      - name: supplier_id
        data_type: varchar
        description: Supplier identifier; the primary key.
        data_tests:
          - unique
          - not_null
      - name: supplier_name
        data_type: varchar
        description: Supplier display name.
      - name: country
        data_type: varchar
        description: Country the supplier is based in.
      - name: risk_tier
        data_type: varchar
        description: Supplier risk tier.
  - name: fct_inventory_snapshots
    access: public
    description: >-
      Periodic inventory snapshots. One row per Silver snapshot, that is per snapshot date, warehouse and product.
      on_hand_units and allocated_units are semi-additive: they sum across warehouses and products within one
      snapshot_date, but not across dates, where a point-in-time value such as the latest or the average applies.
    columns:
      - name: snapshot_id
        data_type: varchar
        description: Snapshot identifier; the primary key.
        data_tests:
          - unique
          - not_null
      - name: snapshot_date
        data_type: date
        description: Date the stock was counted.
      - name: warehouse_id
        data_type: varchar
        description: Warehouse; joins dim_warehouse.warehouse_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouse')
                field: warehouse_id
      - name: product_id
        data_type: varchar
        description: Product; joins sales_core dim_product.product_id (cross-domain).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: on_hand_units
        data_type: integer
        description: Units on hand at the snapshot. Semi-additive over time; do not sum across snapshot dates.
      - name: allocated_units
        data_type: integer
        description: Units on hand already allocated to orders at the snapshot. Semi-additive over time.
      - name: reorder_point
        data_type: integer
        description: Available units at or below which the product is reordered.
  - name: fct_purchase_order_receipts
    access: public
    description: >-
      Purchase orders with what was received against them. One row per purchase order. Shipments are summed per
      order, so an order shipped in parts is still one row; an order with no shipment has shipment_count 0 and null
      delivery columns.
    columns:
      - name: purchase_order_id
        data_type: varchar
        description: Purchase order identifier; the primary key.
        data_tests:
          - unique
          - not_null
      - name: supplier_id
        data_type: varchar
        description: Supplier the order was placed with; joins dim_supplier.supplier_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_id
      - name: product_id
        data_type: varchar
        description: Product; joins sales_core dim_product.product_id (cross-domain).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: warehouse_id
        data_type: varchar
        description: Warehouse; joins dim_warehouse.warehouse_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouse')
                field: warehouse_id
      - name: order_date
        data_type: date
        description: Date the order was placed.
      - name: expected_date
        data_type: date
        description: Date the order was expected to be delivered.
      - name: ordered_units
        data_type: integer
        description: Units ordered.
      - name: shipment_count
        data_type: integer
        description: Shipments received against the order; 0 when it has not shipped.
      - name: ship_date
        data_type: date
        description: Earliest ship date of the order's shipments; null when it has not shipped.
      - name: delivered_date
        data_type: date
        description: Latest delivery date of the order's shipments; null when it has not shipped.
      - name: received_units
        data_type: integer
        description: Units received across the order's shipments; null when it has not shipped.
  - name: fct_stockout_events
    access: public
    description: Stockout events. One row per Silver stockout event.
    columns:
      - name: event_id
        data_type: varchar
        description: Stockout event identifier; the primary key.
        data_tests:
          - unique
          - not_null
      - name: event_date
        data_type: date
        description: Date of the stockout.
      - name: warehouse_id
        data_type: varchar
        description: Warehouse; joins dim_warehouse.warehouse_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouse')
                field: warehouse_id
      - name: product_id
        data_type: varchar
        description: Product; joins sales_core dim_product.product_id (cross-domain).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: lost_units
        data_type: integer
        description: Units of demand lost during the stockout.
      - name: root_cause
        data_type: varchar
        description: Recorded root cause of the stockout.
  - name: mart_inventory_position
    description: Latest inventory position and reorder status by product and warehouse. One row per product and warehouse.
    data_tests:
      - openlakeforge_dbt.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_id
              - warehouse_id
    columns:
      - name: product_id
        data_type: varchar
        description: Product identifier.
        data_tests:
          - not_null
      - name: warehouse_id
        data_type: varchar
        description: Warehouse identifier.
        data_tests:
          - not_null
      - name: warehouse_name
        data_type: varchar
        description: Warehouse display name.
      - name: region
        data_type: varchar
        description: Warehouse region.
      - name: snapshot_date
        data_type: date
        description: Date of the latest snapshot for the product and warehouse.
      - name: on_hand_units
        data_type: integer
        description: Units on hand at the snapshot.
      - name: allocated_units
        data_type: integer
        description: Units allocated to open orders.
      - name: available_units
        data_type: integer
        description: On-hand units minus allocated units.
      - name: reorder_point
        data_type: integer
        description: Available units at or below which stock is reordered.
      - name: inventory_status
        data_type: varchar
        description: reorder when available units are at or below the reorder point, otherwise healthy.
  - name: mart_supplier_delivery_reliability
    description: Supplier delivery lateness, fill rate, and on-time performance. One row per supplier.
    columns:
      - name: supplier_id
        data_type: varchar
        description: Supplier identifier; the grain.
        data_tests:
          - unique
          - not_null
      - name: supplier_name
        data_type: varchar
        description: Supplier display name.
      - name: country
        data_type: varchar
        description: Supplier country.
      - name: risk_tier
        data_type: varchar
        description: Supplier risk tier.
      - name: purchase_order_count
        data_type: bigint
        description: Delivered purchase orders.
      - name: ordered_units
        data_type: bigint
        description: Units ordered.
      - name: received_units
        data_type: bigint
        description: Units received.
      - name: avg_days_late
        data_type: double
        description: Average days between expected and delivered date; negative when early.
      - name: on_time_rate
        data_type: double
        description: Share of deliveries on or before the expected date.
  - name: mart_stockout_risk
    description: Stockout risk by product and warehouse using current inventory and stockout history. One row per product and warehouse.
    data_tests:
      - openlakeforge_dbt.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_id
              - warehouse_id
    columns:
      - name: product_id
        data_type: varchar
        description: Product identifier.
        data_tests:
          - not_null
      - name: warehouse_id
        data_type: varchar
        description: Warehouse identifier.
        data_tests:
          - not_null
      - name: warehouse_name
        data_type: varchar
        description: Warehouse display name.
      - name: region
        data_type: varchar
        description: Warehouse region.
      - name: available_units
        data_type: integer
        description: Available units at the latest snapshot.
      - name: reorder_point
        data_type: integer
        description: Reorder point at the latest snapshot.
      - name: inventory_status
        data_type: varchar
        description: reorder or healthy, from mart_inventory_position.
      - name: stockout_event_count
        data_type: bigint
        description: Recorded stockout events.
      - name: lost_units
        data_type: bigint
        description: Units lost to stockouts.
      - name: stockout_risk
        data_type: varchar
        description: high, medium or low from inventory status and stockout history.
