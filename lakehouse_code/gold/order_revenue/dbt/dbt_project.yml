name: order_revenue
version: "1.0.0"
config-version: 2

profile: order_revenue

model-paths: ["models"]
macro-paths: []
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  order_revenue:
    +database: "{{ env_var('OPENLAKEFORGE_CATALOG_NAME') }}"
    +materialized: table
    +on_table_exists: replace
    # A definer view is re-read by Polaris without the caller's token (#967).
    +view_security: invoker
    +meta:
      dagster:
        group: order_revenue
    gold:
      +tags: ["sales", "order_revenue", "gold"]
