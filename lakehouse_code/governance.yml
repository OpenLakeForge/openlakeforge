apiVersion: openlakeforge.io/v1beta2
kind: Governance
domains:
  - name: sales
    displayName: Sales
    description: Sales proof-of-concept domain for the OpenLakeForge v1 lakehouse path.
    products:
      - id: order_revenue
        displayName: Sales Order Revenue
        description: Curated revenue, channel, discount, and product margin marts for Sales.
        lifecycle: DEVELOPMENT
        glossaryTerms: [sales.NetRevenue, sales.GrossRevenue]
        # Demo values, set to fit the daily 02:00 UTC cadence in pipelines/products.py; not a real commitment.
        sla:
          tier: GOLD
          freshness:
            maximumAge: PT27H
            readyBy: "06:00"
            timezone: Europe/Paris
          availability:
            schedule: "0 2 * * *"
            gracePeriod: PT1H
          minimumQualityScore: 95
      - id: customer_health
        displayName: Sales Customer Health
        description: Curated customer health, churn risk, support SLA, and NPS marts for Sales.
        lifecycle: DEVELOPMENT
      - id: sales_core
        displayName: Sales Core
        description: Conformed sales facts and dimensions - order lines, accounts, products, channels and promotions.
        type: DATASET
        tier: Tier1
        lifecycle: DEVELOPMENT
        classification: Internal
        profiling:
          enabled: true
        # Demo values, set to fit the daily 01:30 UTC cadence in pipelines/products.py; not a real commitment.
        sla:
          tier: SILVER
          freshness:
            maximumAge: PT26H
  - name: supply_chain
    displayName: Supply Chain
    description: Supply Chain proof-of-concept domain for inventory and supplier reliability analytics.
    products:
      - id: inventory_reliability
        displayName: Supply Chain Inventory Reliability
        description: Curated inventory position, supplier delivery, and stockout risk marts for Supply Chain.
        lifecycle: DEVELOPMENT
