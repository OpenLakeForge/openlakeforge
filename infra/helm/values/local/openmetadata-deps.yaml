# openmetadata-dependencies chart 1.13.6 — OpenSearch only.
# MySQL replaced by shared PostgreSQL cluster; Airflow replaced by K8s pipeline client.

mysql:
  enabled: false

opensearch:
  enabled: true
  singleNode: true
  # The chart otherwise derives majorVersion by semver-parsing image.tag;
  # supply it explicitly so image.tag can include the immutable digest.
  majorVersion: 3
  image:
    repository: opensearchproject/opensearch
    tag: "3.3.2@sha256:798cf28e226a32f5c928dd1ed9478dd3a33d2212176aad3679020088ad3afa1a"
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 2Gi
  opensearchJavaOpts: "-Xms512m -Xmx1g"
  config:
    opensearch.yml: |
      plugins.security.disabled: true
      indices.query.bool.max_clause_count: 4096
      cluster.routing.allocation.disk.threshold_enabled: false

airflow:
  enabled: false
