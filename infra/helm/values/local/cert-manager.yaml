# cert-manager for the local kind cluster: issues route certificates from the
# local CA ClusterIssuer (infra/terraform/modules/access/cert-manager).
crds:
  enabled: true

prometheus:
  enabled: false

image:
  repository: quay.io/jetstack/cert-manager-controller
  tag: "v1.21.3@sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc"
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  image:
    repository: quay.io/jetstack/cert-manager-webhook
    tag: "v1.21.3@sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

cainjector:
  image:
    repository: quay.io/jetstack/cert-manager-cainjector
    tag: "v1.21.3@sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# Only pulled for ACME HTTP-01 challenges, which the local CA never issues;
# pinned so no unpinned reference reaches the controller's flags.
acmesolver:
  image:
    repository: quay.io/jetstack/cert-manager-acmesolver
    tag: "v1.21.3@sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7"

# The post-install hook that holds the release until the webhook answers, so
# the local CA issuers applied right after it are not rejected.
startupapicheck:
  image:
    repository: quay.io/jetstack/cert-manager-startupapicheck
    tag: "v1.21.3@sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
