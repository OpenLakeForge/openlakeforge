# cert-manager for the local kind cluster: issues route certificates from the
# local CA ClusterIssuer (infra/terraform/modules/access/cert-manager).
crds:
  enabled: true

prometheus:
  enabled: false

image:
  repository: quay.io/jetstack/cert-manager-controller
  tag: "v1.21.2@sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8"
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  image:
    repository: quay.io/jetstack/cert-manager-webhook
    tag: "v1.21.2@sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

cainjector:
  image:
    repository: quay.io/jetstack/cert-manager-cainjector
    tag: "v1.21.2@sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# Only pulled for ACME HTTP-01 challenges, which the local CA never issues;
# pinned so no unpinned reference reaches the controller's flags.
acmesolver:
  image:
    repository: quay.io/jetstack/cert-manager-acmesolver
    tag: "v1.21.2@sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503"

# The post-install hook that holds the release until the webhook answers, so
# the local CA issuers applied right after it are not rejected.
startupapicheck:
  image:
    repository: quay.io/jetstack/cert-manager-startupapicheck
    tag: "v1.21.2@sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
