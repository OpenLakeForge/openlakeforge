# Trino SQL query engine for the local kind cluster.
image:
  repository: trinodb/trino
  tag: "484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f"

server:
  workers: 0

# Traefik forwards to the coordinator's plain HTTP listener, its only one
# (docs/adr/0016-trino-workload-authentication.md D1), and adds X-Forwarded-*
# headers, which Trino rejects unless told to process them. modules/query/trino
# replaces this list wholesale (config.tf) and keeps this line.
additionalConfigProperties:
  - http-server.process-forwarded=true

coordinator:
  deployment:
    # Kind shares the Docker VM with provider image builds. Avoid running two
    # 2 GiB coordinators during an update, which can otherwise starve both.
    strategy:
      type: Recreate
  # Concurrent cloud image builds can temporarily starve the Docker VM that
  # hosts Kind. Give Trino enough startup budget to survive that contention.
  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 120
    successThreshold: 1
  jvm:
    maxHeapSize: "2G"
  config:
    query:
      maxMemoryPerNode: "1GB"
    nodeScheduler:
      includeCoordinator: true
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi

service:
  type: ClusterIP
  port: 8080
