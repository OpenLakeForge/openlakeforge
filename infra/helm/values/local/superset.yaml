# Apache Superset BI service for the local kind cluster.
# PostgreSQL is provided by the shared PostgreSQL module; Redis remains
# chart-managed for local cache and worker support.

runAsUser: 0

bootstrapScript: |
  #!/bin/bash
  if [ ! -f ~/bootstrap ]; then echo "Running Superset with uid {{ .Values.runAsUser }}" > ~/bootstrap; fi

extraEnv:
  PYTHONPATH: /app/pythonpath

# OpenLakeForge's prebuilt image, published and signed by the release workflow
# (release/component-catalog.yaml, superset).
image:
  repository: ghcr.io/openlakeforge/openlakeforge/superset
  tag: "0.5.0-alpha.1@sha256:ef312c379b0f58faa77e70192cc909b730f4a228fed1ce1614b5bed0118eb08e"

initImage:
  repository: apache/superset
  tag: "dockerize@sha256:afe59523a6c8774c3b16d0f44146b2e52f327a7d26a47b4cc63b904fcdedf057"

postgresql:
  enabled: false

redis:
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: "7.0.10-debian-11-r4@sha256:224a79826b42869bdc72a70933efd840c5a5f10a70caafca68e57be6901e36fb"
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

supersetNode:
  replicas:
    enabled: true
    replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

supersetWorker:
  replicas:
    enabled: true
    replicaCount: 1
  command:
    - /bin/sh
    - -c
    - ". /app/pythonpath/superset_bootstrap.sh; celery --app=superset.tasks.celery_app:app worker --pool=solo --concurrency=1"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

supersetCeleryBeat:
  enabled: false

supersetCeleryFlower:
  enabled: false

supersetWebsockets:
  enabled: false

init:
  enabled: true
  loadExamples: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

service:
  type: ClusterIP
  port: 8088

configOverrides:
  openlakeforge_local: |
    ENABLE_PROXY_FIX = True
    WTF_CSRF_TIME_LIMIT = 60 * 60 * 24 * 365
