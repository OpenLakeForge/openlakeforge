# Dagster orchestration layer for the local kind cluster.
# The webserver and daemon are the Terraform-owned control plane: neither
# imports lakehouse_code, they reach user code over gRPC. Pinning the upstream
# image here keeps a platform apply independent of any project build (#115),
# and the tag must track the chart version pinned in the component catalog.
# Never pin a build shipping the kubernetes 36.0.0 client (1.13.6 did): its
# in-cluster loader drops the service-account token, so the daemon's run
# launcher calls the API as system:anonymous and every launch 403s (#234).
dagsterWebserver:
  image:
    repository: docker.io/dagster/dagster-celery-k8s
    tag: "1.13.7@sha256:7e9fa5d3f9724bdf382932f34294dbfe5c9ca550641795dff793d6b59f3cc4ee"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

dagsterDaemon:
  enabled: true
  image:
    repository: docker.io/dagster/dagster-celery-k8s
    tag: "1.13.7@sha256:7e9fa5d3f9724bdf382932f34294dbfe5c9ca550641795dff793d6b59f3cc4ee"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

postgresql:
  enabled: false
  # check-db-ready's pg_isready runs the catalog's prefetched `postgres` image, not the chart's
  # unpinned postgres:14.6.
  image:
    registry: docker.io/library
    repository: postgres
    tag: 16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777

# The user-deployment wait (`until nslookup <service>`), pinned so prefetch can load it. 1.28 on purpose:
# later busybox nslookup ignores the resolv.conf search list, so the short service name never resolves.
busybox:
  image:
    repository: docker.io/busybox
    tag: 1.28@sha256:141c253bc4c3fd0a201d32dc1f493bcf3fff003b6df416dea4f41046e0f37d47

computeLogManager:
  type: S3ComputeLogManager
  config:
    s3ComputeLogManager:
      bucket: openlakeforge-ops
      localDir: /tmp/dagster-compute-logs
      prefix: logs/dagster/compute
      useSsl: false
      verify: false
      endpointUrl: http://seaweedfs-s3.olf-system:8333
      region: us-east-1
      skipEmptyFiles: true

telemetry:
  enabled: false
