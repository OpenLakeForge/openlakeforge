# Dagster orchestration layer for the local kind cluster.
# The webserver and daemon are the Terraform-owned control plane: neither
# imports lakehouse_code, they reach user code over gRPC. Pinning the upstream
# image here keeps a platform apply independent of any project build (#115),
# and the tag must track the chart version pinned in the component catalog.
# Never pin a build shipping the kubernetes 36.0.0 client (1.13.6 did): its
# in-cluster loader drops the service-account token, so the daemon's run
# launcher calls the API as system:anonymous and every launch 403s (#234).
dagsterWebserver:
  image:
    repository: docker.io/dagster/dagster-celery-k8s
    tag: "1.13.31@sha256:30b8078e9a1a100b5c02e842154c5a3d43e2181452a1578004f77e8ca16a6758"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

dagsterDaemon:
  enabled: true
  # One run per Silver domain at a time: a domain's products read and overwrite the same Silver tables, so their
  # runs queue behind each other. The tag is set by openlakeforge_runtime.product_dagster (SILVER_DOMAIN_TAG).
  # Local, AWS and Azure all take this file as the release's base values.
  runCoordinator:
    enabled: true
    type: QueuedRunCoordinator
    config:
      queuedRunCoordinator:
        tagConcurrencyLimits:
          - key: openlakeforge/silver-domain
            value:
              applyLimitPerUniqueValue: true
            limit: 1
  # The overall limit, `maxConcurrentRuns`, is the stage's size: modules/orchestration/dagster sets it from
  # release/query-sizes.yaml.
  #
  # Run monitoring is on in the chart (startTimeoutSeconds 300, pollIntervalSeconds 120): the daemon fails a run
  # whose run pod is gone (evicted, deleted, node lost) on a poll, so the run releases its queue slot and the
  # domain limit above does not block every later run of that domain. This sets pollIntervalSeconds to 30, to
  # find a lost run sooner, and adds maxRuntimeSeconds (4 hours), which terminates a hung run.
  runMonitoring:
    enabled: true
    startTimeoutSeconds: 300
    pollIntervalSeconds: 30
    maxRuntimeSeconds: 14400
  image:
    repository: docker.io/dagster/dagster-celery-k8s
    tag: "1.13.31@sha256:30b8078e9a1a100b5c02e842154c5a3d43e2181452a1578004f77e8ca16a6758"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

postgresql:
  enabled: false
  # check-db-ready's pg_isready runs the catalog's prefetched `postgres` image, not the chart's
  # unpinned postgres:14.6.
  image:
    registry: docker.io
    repository: library/postgres
    tag: 18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71

# The user-deployment wait (`until nslookup <service>`), pinned so prefetch can load it. 1.28 on purpose:
# from 1.29 busybox nslookup queries the short name under every resolv.conf search domain and exits 1 if any
# answers NXDOMAIN (networking/nslookup.c of 1.38.0), so in a pod the wait never ends. The chart (1.13.31 still
# defaults to busybox 1.28) renders that init container only with dagster-user-deployments.enableSubchart,
# which modules/orchestration/dagster turns off.
busybox:
  image:
    repository: docker.io/busybox
    tag: 1.28@sha256:141c253bc4c3fd0a201d32dc1f493bcf3fff003b6df416dea4f41046e0f37d47

computeLogManager:
  type: S3ComputeLogManager
  config:
    s3ComputeLogManager:
      bucket: openlakeforge-ops
      localDir: /tmp/dagster-compute-logs
      prefix: logs/dagster/compute
      useSsl: false
      verify: false
      endpointUrl: http://seaweedfs-s3.olf-system:8333
      region: us-east-1
      skipEmptyFiles: true

telemetry:
  enabled: false
