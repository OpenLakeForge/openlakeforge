# Apache Polaris Iceberg REST catalog for the local kind cluster.
image:
  repository: apache/polaris
  tag: "1.8.0@sha256:347615e736cab2c9be0d8c464552ac930be4755302bb0aeb745216bbae99ba5b"
  pullPolicy: IfNotPresent

replicaCount: 1

# Polaris stores catalog state in the shared in-cluster PostgreSQL service.
# Terraform supplies the relational JDBC Secret reference from the database contract.
# This is a chart-level value; nesting it under `polaris` silently selects the
# chart's in-memory default and loses principals after a pod restart.
persistence:
  type: relational-jdbc

service:
  type: ClusterIP
  port: 8181

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi
