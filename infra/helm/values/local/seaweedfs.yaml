# SeaweedFS S3-compatible object storage for the local kind cluster.
global:
  seaweedfs:
    loggingLevel: 1

image:
  repository: chrislusf/seaweedfs
  tag: "4.23@sha256:c6d6fb84b081f1f09bb089184ff4b45d2f163a1bfa8b354d04cf400c6e06f242"

master:
  replicas: 1
  affinity: ""
  data:
    type: "emptyDir"
  logs:
    type: "emptyDir"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

volume:
  replicas: 1
  affinity: ""
  dataDirs:
    - name: data1
      type: "emptyDir"
      # One volume server holds every collection: ops plus bronze/silver/gold
      # per enabled stage. A collection's first write grows 7 volumes
      # (SeaweedFS's default growth for replication 000), and a write that
      # finds no free slot fails as S3 InternalError. DEV+UAT+PROD is 10
      # collections, 70 slots; 32 fit one stage and failed PROD's first
      # Bronze write (#208). Empty volumes are sparse, so slots are cheap.
      maxVolumes: 80
  logs:
    type: "emptyDir"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

filer:
  replicas: 1
  affinity: ""
  data:
    type: "emptyDir"
  logs:
    type: "emptyDir"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

s3:
  enabled: true
  enableAuth: true
  port: 8333
  createBuckets: []
  logs:
    type: "emptyDir"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
