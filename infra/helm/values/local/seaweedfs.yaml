# SeaweedFS S3-compatible object storage for the local kind cluster and the
# Azure POC. Master, filer and volume data sit on PVCs from the cluster's
# default storage class, so replacing a pod (upgrade, eviction, node restart)
# keeps every object that Polaris and OpenMetadata still reference (#241).
# Logs stay on emptyDir. The sizes are fixed defaults until the profile can
# size storage (#326).
global:
  seaweedfs:
    loggingLevel: 1
    # The chart ships a cluster-wide pod-delete ClusterRole for a post-migration
    # master-restart hack; nothing here needs it (ADR 0017, RBAC inventory).
    createClusterRole: false

image:
  repository: chrislusf/seaweedfs
  tag: "4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d"

master:
  replicas: 1
  affinity: ""
  data:
    type: "persistentVolumeClaim"
    size: 1Gi
  logs:
    type: "emptyDir"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

volume:
  replicas: 1
  affinity: ""
  dataDirs:
    - name: data1
      type: "persistentVolumeClaim"
      size: 20Gi
      # One volume server holds every collection: ops plus bronze/silver/gold
      # per enabled stage. A collection's first write grows 7 volumes
      # (SeaweedFS's default growth for replication 000), and a write that
      # finds no free slot fails as S3 InternalError. DEV+UAT+PROD is 10
      # collections, 70 slots; 32 fit one stage and failed PROD's first
      # Bronze write (#208). Empty volumes are sparse, so slots are cheap.
      maxVolumes: 80
  logs:
    type: "emptyDir"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

filer:
  replicas: 1
  affinity: ""
  data:
    type: "persistentVolumeClaim"
    size: 5Gi
  logs:
    type: "emptyDir"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

s3:
  enabled: true
  enableAuth: true
  port: 8333
  createBuckets: []
  # 4.48 adds a Lance Namespace server to the gateway; nothing here uses it.
  lancePort: 0
  # Before 4.48 the gateway kept up to 256 fetched chunks (up to 8 MiB each) for
  # S3 GETs, and only a 257th distinct chunk evicted one, so memory grew with
  # every product run until the limit OOMKilled it. 4.48 releases a
  # chunk once its readers finish; the budget caps what concurrent GETs hold.
  extraArgs:
    - -readerCacheSizeMB=64
  # Go's default GC lets the heap reach twice the live set and returns idle
  # pages lazily, which alone filled the old 256Mi limit under load.
  extraEnvironmentVars:
    GOMEMLIMIT: 192MiB
  logs:
    type: "emptyDir"
  # Measured peak 247 MiB with the settings above, over repeated rounds of
  # Bronze-sized PUTs, parallel full reads and ranged Parquet reads; idle it
  # settles at 80-220 MiB.
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 384Mi
