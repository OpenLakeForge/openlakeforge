kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: openlakeforge-local
nodes:
  - role: control-plane
    # Traefik pins itself to this label and binds 80/443 as hostPorts
    # (infra/helm/values/local/traefik.yaml). Loopback only: the local
    # ingress is not meant to be reachable from the LAN.
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
  # One worker: every kind node is a container on the same host, so a second
  # adds no CPU or memory, only a second copy of every prefetched image (about
  # 30 GB on a Full deployment, #1370).
  - role: worker
