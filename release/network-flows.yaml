    to: {scope: shared, pods: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: postgresql}}
    ports: [5432]
    tag: V
  - id: F6
    from: {scope: shared, pods: {app.kubernetes.io/name: openmetadata, app.kubernetes.io/instance: openmetadata}}
    to: {scope: shared, pods: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: postgresql}}
    ports: [5432]
    tag: V
  - id: F6
    from: {scope: shared, pods: {app.kubernetes.io/name: polaris, app.kubernetes.io/instance: polaris}}
    to: {scope: shared, pods: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: postgresql}}
