# Flow table of docs/adr/0017-local-network-policy-and-rbac.md as data. Read
# by infra/terraform/modules/security/network-policy and validated by
# `olf check flows`. Every flow not listed is denied.
#
# scope: stage (every stage namespace, one trust domain), shared (olf-system),
#   kube-system, apiserver (the kubernetes Service and API server endpoints),
#   node (the cluster nodes) or any (outside the cluster).
# pods: optional label selector inside the scope; absent means every pod.
# ports/protocols: container ports (policies see the post-DNAT port);
#   protocols defaults to [TCP].
# tag: V read from the tree, T needs a running cluster to confirm.
#
# workloads: the olf-system pods that get a default-deny policy of their own,
# by label. A row's `from` or `to` gives that workload a rule when its pods
# include all the workload's labels, so a row has to carry the instance label
# to reach a chart pod; a Job shares its workload's name label but not the
# instance one, so a Job is selected by its own openlakeforge.io/job label.
# DNS egress is added to every workload by the module and is not a row. The
# module drops a workload that is not deployed (Keycloak, Dex, governance):
# its rows then render only on the side that is.
#
# `from` may be a list of endpoints: one row, several sources.
# scope any is every address outside the pod and Service ranges; node is the
# cluster nodes. A pod reaches a destination only through a row on both sides.
workloads:
  postgresql: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: postgresql}
  seaweedfs: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: seaweedfs}
  polaris: {app.kubernetes.io/name: polaris, app.kubernetes.io/instance: polaris}
  trino: {app.kubernetes.io/name: trino, app.kubernetes.io/instance: trino, app.kubernetes.io/component: coordinator}
  traefik: {app.kubernetes.io/name: traefik, app.kubernetes.io/instance: traefik-olf-system}
  oauth2-proxy: {openlakeforge.io/workload: oauth2-proxy} # a pod label the perimeter module sets; the floors differ in name
  portal: {app.kubernetes.io/name: portal}
  keycloak: {app.kubernetes.io/name: keycloak, app.kubernetes.io/instance: keycloak}
  dex: {app.kubernetes.io/name: dex, app.kubernetes.io/instance: dex}
  cert-manager-controller: {app.kubernetes.io/name: cert-manager, app.kubernetes.io/instance: cert-manager, app.kubernetes.io/component: controller}
  cert-manager-cainjector: {app.kubernetes.io/name: cainjector, app.kubernetes.io/instance: cert-manager, app.kubernetes.io/component: cainjector}
  cert-manager-webhook: {app.kubernetes.io/name: webhook, app.kubernetes.io/instance: cert-manager, app.kubernetes.io/component: webhook}
  cert-manager-startupapicheck: {app.kubernetes.io/name: startupapicheck, app.kubernetes.io/instance: cert-manager, app.kubernetes.io/component: startupapicheck}
  openmetadata: {app.kubernetes.io/name: openmetadata, app.kubernetes.io/instance: openmetadata}
  opensearch: {app.kubernetes.io/name: opensearch} # instance label unread: the dependencies chart is not rendered here
  bucket-bootstrap: {openlakeforge.io/job: bucket-bootstrap}
  catalog-metastore-bootstrap: {openlakeforge.io/job: catalog-metastore-bootstrap}
  catalog-bootstrap: {openlakeforge.io/job: catalog-bootstrap}
  catalog-credential-replication: {openlakeforge.io/job: catalog-credential-replication}
  keycloak-credentials: {openlakeforge.io/job: keycloak-credentials}
  keycloak-realm: {openlakeforge.io/job: keycloak-realm}
  dex-credentials: {openlakeforge.io/job: dex-credentials}
  perimeter-cookie-secret: {openlakeforge.io/job: perimeter-cookie-secret}
  publish-local-ca: {openlakeforge.io/job: publish-local-ca}
  trino-credentials: {openlakeforge.io/job: trino-credentials}
  governance-bootstrap: {openlakeforge.io/job: governance-bootstrap}
  governance-credential-replication: {openlakeforge.io/job: governance-credential-replication}
  catalog-refresh: {openlakeforge.io/job: catalog-refresh}
  openmetadata-trino-ingestion: {openlakeforge.io/job: openmetadata-trino-ingestion}
flows:
  - id: F3
    from: {scope: shared, pods: {app.kubernetes.io/name: traefik, app.kubernetes.io/instance: traefik-olf-system}}
    to: {scope: stage}
    ports: [80, 8088] # Dagster webserver, Superset; the stage rule is namespace-wide
    tag: V
  - id: F5
    from: {scope: stage}
    to: {scope: kube-system, pods: {k8s-app: kube-dns}}
    ports: [53]
    protocols: [UDP, TCP]
    tag: V
  - id: F6
    from: {scope: stage}
    to: {scope: shared, pods: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: postgresql}}
    ports: [5432]
    tag: V
  - id: F9
    from: {scope: stage}
    to: {scope: shared, pods: {app.kubernetes.io/name: polaris, app.kubernetes.io/instance: polaris}}
    ports: [8181]
    tag: T # Floe runner pod labels are not in the tree; the stage rule ignores them
  - id: F9
    from: {scope: stage}
    to: {scope: shared, pods: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/instance: seaweedfs, app.kubernetes.io/component: s3}}
    ports: [8333]
