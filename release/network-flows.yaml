    to: {scope: shared, pods: {app.kubernetes.io/name: trino, app.kubernetes.io/instance: trino, app.kubernetes.io/component: coordinator}}
    ports: [8080, 8443] # 8443 is the contract's tls_port once workload authentication is on
    tag: V
  - id: F12
    from: {scope: stage}
    to: {scope: shared, pods: {app.kubernetes.io/name: openmetadata, app.kubernetes.io/instance: openmetadata}}
    ports: [8585]
    tag: V
  - id: F14
    from: [{scope: shared, pods: {app.kubernetes.io/name: openmetadata, app.kubernetes.io/instance: openmetadata}}, {scope: shared, pods: {openlakeforge.io/job: governance-bootstrap}}, {scope: shared, pods: {openlakeforge.io/job: openmetadata-trino-ingestion}}]
    to: {scope: stage}
    ports: [8088]
    tag: T # whether OpenMetadata ingestion reaches Superset today is unconfirmed; the Job labels are ours, the server's are not read
  - id: F20
    from: {scope: stage}
    to: {scope: apiserver}
    ports: [443, 6443] # Service port and endpoint port; DNAT order is unconfirmed
    tag: T
  - id: F6
    from: {scope: shared, pods: {app.kubernetes.io/name: keycloak, app.kubernetes.io/instance: keycloak}}
    to: {scope: shared, pods: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: postgresql}}
