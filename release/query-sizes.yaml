# Trino sizes for spec.query.size (deployment profile, #323). One mapping for
# every provider: `olf` renders the chosen entry into the `query_sizing`
# Terraform variable (the local root today; AWS and Azure in their own
# changes), and modules/query/trino turns it into Helm values. The
# profile carries no worker, CPU or memory field of its own.
#
# `small` is today's single-node Trino and must stay identical to
# infra/helm/values/local/trino.yaml (a test enforces it; the chart default
# supplies max_memory). `medium` and `large` are provisional: they are sized
# to fit a local kind host, not measured. #328/#329 own the baseline that
# replaces them. The profile does not accept them yet (#324): workers still
# need network flows to the coordinator, authentication across nodes (#367)
# and a kind run.
#
# workers: worker pods; 0 runs the coordinator alone.
# schedule_on_coordinator: whether the coordinator also executes query work.
# heap: JVM max heap. A node needs heap above 1/0.7 of max_memory_per_node
#   because Trino reserves 30% of it as headroom.
# max_memory: query.max-memory, the per-query limit across the cluster.
# max_memory_per_node: query.max-memory-per-node, the per-query limit on one node.
# max_stage_count: query.max-stage-count. A query reads about two stages per
#   table, so one Gold query reads at most max_stage_count / 2 tables (Trino's
#   default of 150 stopped a 75-table union at 152 stages, #706). Each stage
#   costs the coordinator scheduling work and memory, so the value follows its
#   heap: the coordinator keeps the same 2G heap in every size, hence 300.
sizes:
  small:
    workers: 0
    schedule_on_coordinator: true
    max_memory: 4GB
    max_memory_per_node: 1GB
    max_stage_count: 300
    coordinator:
      heap: 2G
      cpu_request: 500m
      memory_request: 2Gi
      memory_limit: 3Gi
  # Coordinator plus 2 workers. Needs about 6Gi of requested memory (9Gi at the
  # limit) and 1.5 CPU for Trino alone, on top of the rest of the stack.
  medium:
    workers: 2
    schedule_on_coordinator: false
    max_memory: 2GB
    max_memory_per_node: 1GB
    max_stage_count: 300
    coordinator:
      heap: 2G
      cpu_request: 500m
      memory_request: 2Gi
      memory_limit: 3Gi
    worker:
      heap: 2G
      cpu_request: 500m
      memory_request: 2Gi
      memory_limit: 3Gi
  # Coordinator plus 4 workers. Needs about 10Gi of requested memory (15Gi at
  # the limit) and 2.5 CPU for Trino alone, on top of the rest of the stack.
  large:
    workers: 4
    schedule_on_coordinator: false
    max_memory: 4GB
    max_memory_per_node: 1GB
    max_stage_count: 300
    coordinator:
      heap: 2G
      cpu_request: 500m
      memory_request: 2Gi
      memory_limit: 3Gi
    worker:
      heap: 2G
      cpu_request: 500m
      memory_request: 2Gi
      memory_limit: 3Gi
