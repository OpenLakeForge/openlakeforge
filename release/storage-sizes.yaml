# Volume sizes behind `spec.storage.size` (ADR 0011), one row per size, read by
# the SeaweedFS Terraform module and by `olf` (the expansion check). Provider
# neutral: a size names how much object storage a deployment carries, and every
# provider that self-hosts it reads the same row.
#
# PROVISIONAL. Only `small` is today's measured footprint. `medium` and `large`
# are sized from the rough ranges in docs/reference/deployment-profile.md
# (a few hundred GB, 1-5 TB) and stay provisional until the #329 report
# calibrates them. The profile still accepts only `small` for `storage.size`:
# a row is selectable once `olf` enforces that a volume only grows (#326).
#
# object_store.master, filer: metadata PVCs, sized for the object count the data
#   volume implies, not for the data itself.
# object_store.volume: the data PVC of the one volume server.
# object_store.max_volumes: volume slots on that server. SeaweedFS fills a slot
#   up to 1000 MB (the master's volumeSizeLimitMB), so the PVC is only usable
#   if there is a slot per GiB. Every size also keeps the 80 slots `small` has:
#   one volume server holds every collection of every enabled stage, a
#   collection's first write grows 7 volumes, and a write that finds no free
#   slot fails as S3 InternalError. DEV+UAT+PROD is 10 collections, 70 slots
#   (#208). Empty volumes are sparse, so slots are cheap.
sizes:
  small:
    object_store: {master: 1Gi, filer: 5Gi, volume: 20Gi, max_volumes: 80}
  medium:
    object_store: {master: 2Gi, filer: 20Gi, volume: 300Gi, max_volumes: 380}
  large:
    object_store: {master: 5Gi, filer: 50Gi, volume: 2Ti, max_volumes: 2128}
