# Canonical OpenLakeForge role model (ADR 0014). Product-level and fixed for
# v0.5-alpha: every provider renders this file into shared.identity.roles and
# `olf` rejects a contract that differs from it.
#
# precedence: highest role first.
# grants: route service name (last segment of the route's contract ref) ->
#   role -> the in-service role that grant maps to. A role with no entry for a
#   service is denied at the perimeter. A grant applies on every enabled stage.
#   Grants are monotonic: a role holding a service's grant implies every role
#   above it holds one too, so "union of held roles" equals "highest role".
precedence:
  - platform-admin
  - data-engineer
  - analyst
  - viewer

grants:
  orchestration: # Dagster: no in-service authorization, the perimeter is the control
    platform-admin: full
    data-engineer: full
  reporting: # Superset
    platform-admin: Admin
    data-engineer: Alpha
    analyst: Gamma
    viewer: read-only
  governance_service: # OpenMetadata
    platform-admin: Admin
    data-engineer: write
    analyst: read
    viewer: read
  query: # Trino UI
    platform-admin: "yes"
    data-engineer: "yes"
  # Trino's /v1 for `olf query`, a person's own queries (ADR 0019): every
  # role reaches it, and Polaris's grants decide which tables each one reads.
  query_api:
    platform-admin: "yes"
    data-engineer: "yes"
    analyst: "yes"
    viewer: "yes"

# data_access (ADR 0019): role -> stage -> medallion layer -> read | write, for
#   a person's own queries; an absent role, stage or layer is no access. Polaris
#   enforces it as catalog grants, so each stage row is one of the three shapes
#   a catalog role can express: every layer write, every layer read, or Gold
#   read alone. Monotonic like the grants: a role reaches at least what every
#   role below it reaches, on every stage and layer.
data_access:
  platform-admin:
    dev: {bronze: write, silver: write, gold: write}
    uat: {bronze: write, silver: write, gold: write}
    prod: {bronze: write, silver: write, gold: write}
  data-engineer:
    dev: {bronze: write, silver: write, gold: write}
    uat: {bronze: read, silver: read, gold: read}
    prod: {bronze: read, silver: read, gold: read}
  analyst:
    dev: {gold: read}
    uat: {gold: read}
    prod: {gold: read}
  viewer:
    uat: {gold: read}
    prod: {gold: read}
