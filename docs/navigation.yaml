# Published documentation: the sidebar of openlakeforge.dev, in order.
#
# The website syncs this file from a release tag and renders exactly the pages
# listed here. Paths are relative to the repository root. An item is a path, or
# a mapping with `path` and optional `slug` and `title` overrides; a section
# with `autogenerate` publishes every page in that directory, sorted by name.
#
# Every Markdown file under docs/ must be published or excluded:
# `olf check docs` fails otherwise, and on any relative link that does not
# resolve.
sections:
  - label: Get started
    items:
      - docs/README.md
      - docs/get-started/introduction.md
      - docs/get-started/quickstart.md
      - docs/get-started/concepts.md
  - label: Tutorial
    items:
      - docs/tutorial/01-tour-the-platform.md
      - docs/tutorial/02-ingest-a-source.md
      - docs/tutorial/03-validate-into-silver.md
      - docs/tutorial/04-model-gold-with-dbt.md
      - docs/tutorial/05-orchestrate-and-schedule.md
      - docs/tutorial/06-publish-a-dashboard.md
      - docs/tutorial/07-govern-and-trace-lineage.md
  # The core tutorial ends at lesson 7; these continue the same project.
  - label: "Tutorial: stages and cloud"
    items:
      - docs/tutorial/08-add-prod-and-promote.md
      - docs/tutorial/09-deploy-to-the-cloud.md
  - label: Guides
    items:
      - docs/guides/local-installation.md
      - docs/guides/data-products.md
      - docs/guides/dashboards-as-code.md
      - docs/guides/cloud/deploy-to-aws.md
      - docs/guides/cloud/deploy-to-azure.md
      # Dex and the perimeter's error pages link to this path on GitHub: keep it.
      - docs/setup/github-oauth-app.md
      - docs/guides/promote-dev-to-prod.md
      - docs/guides/troubleshooting.md
  - label: Reference
    items:
      - docs/reference/cli.md
      - docs/reference/deployment-profile.md
      - docs/reference/descriptors.md
      - docs/reference/components.md
      - docs/reference/compatibility-matrix.md
      - docs/reference/glossary.md
  - label: Architecture
    items:
      - docs/architecture/overview.md
      - { path: docs/architecture/diagrams/README.md, title: Kubernetes runtime charts }

# Maintainer material: kept in the repository, never published. Public pages
# may link to it; the site turns those links into GitHub links.
exclude:
  - docs/adr/
  - docs/architecture/README.md
  - docs/architecture/aws-eks-poc.md
  - docs/architecture/azure-aks-poc.md
  - docs/architecture/diagrams/chart3-ephemeral-job-lifecycle.md
  - docs/architecture/diagrams/src/
  - docs/architecture/floe-validation.md
  - docs/architecture/identity-callers.md
  - docs/architecture/identity-credentials.md
  - docs/architecture/identity-service-permissions.md
  - docs/architecture/identity-sessions-and-recovery.md
  - docs/architecture/local-stack-contracts.md
  - docs/architecture/project-revisions.md
  - docs/architecture/provider-contracts.md
  - docs/reference/component-catalog.md
  - docs/release/releasing.md
  - docs/technical-debt.md
  - docs/testing/
