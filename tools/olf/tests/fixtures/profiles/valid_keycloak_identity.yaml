apiVersion: openlakeforge.io/v1alpha1
kind: DeploymentProfile

metadata:
  name: fixture-identity

spec:
  provider:
    type: local
  preset: slim
  stages:
    dev:
      enabled: true
  access: {}
  identity:
    smtp:
      host: smtp.example.org
      port: 587
      from_address: olf@example.org
      auth: true
      credentials_secret_ref:
        name: smtp-credentials
