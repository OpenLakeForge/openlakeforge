[build-system]
requires = ["setuptools>=69"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "openlakeforge"
version = "0.5.1a3"
description = "OpenLakeForge deployment tooling: cross-environment contract, API, and artifact helpers behind the olf CLI."
requires-python = ">=3.12"
dependencies = [
  "azure-identity>=1.25,<2",
  "azure-mgmt-containerservice>=41,<42",
  "azure-mgmt-resource>=24,<25",
  "boto3>=1.34,<2",
  "cryptography>=43",
  "jsonschema>=4.23,<5",
  "openlakeforge-core==0.5.1a3",
  "openlakeforge-lakehouse-services==0.5.1a3",
  "openlakeforge-runtime==0.5.1a3",
  "python-hcl2>=6,<7",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
]

[tool.uv.sources]
openlakeforge-core = { path = "../../packages/core" }
openlakeforge-lakehouse-services = { path = "../../packages/lakehouse-services" }
openlakeforge-runtime = { path = "../../packages/runtime", editable = true }

[project.scripts]
olf = "olf.cli:main"

[dependency-groups]
dev = [
  "boto3-stubs>=1.43.88",
  "mypy>=1.13,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.6",
  "types-jsonschema>=4.26.0.20260518",
  "types-pyyaml>=6.0.12.20260815",
  "types-requests>=2.33.0.20260712",
]

[tool.setuptools.packages.find]
include = ["olf*"]

[tool.setuptools.package-data]
"olf.common" = ["_embedded/*.json", "_embedded/*.tar.gz"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer resolves repeatable options (`list[str]`) via `typer.Option(...)`
# called directly in the parameter default; that is Typer's documented API,
# not the mutable-default-argument pitfall B008 otherwise guards against.
"olf/common/commands/domain.py" = ["B008"]
"olf/common/commands/product.py" = ["B008"]
"olf/common/commands/source.py" = ["B008"]
"olf/infra/commands/e2e.py" = ["B008"]
"olf/infra/commands/source.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["olf"]
# openlakeforge-runtime is an editable install, whose import hook mypy cannot follow.
mypy_path = "$MYPY_CONFIG_FILE_DIR/../../packages/runtime"
# Deliberately not `strict`. The gate's job on a 25k-line codebase that has
# never been type-checked is to stop new type errors, not to relitigate every
# existing one. Every `olf` module is checked; adding an `ignore_errors`
# override needs a reason in the pull request body.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# Dagster, Floe and dlt are installed only in the project-code environment
# `olf check project-code` builds, and `lakehouse_code` is a user-project root that is not
# importable from the CLI package.
[[tool.mypy.overrides]]
module = [
  "dagster.*",
  "dlt",
  "dlt.*",
  "floe_dagster.*",
  "lakehouse_code.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `lakehouse_code` sits at the repository root beside the CLI rather than installed into it.
pythonpath = ["../.."]

[tool.coverage.run]
# The service clients moved out of `olf` (ADR 0021) are still tested here.
source = ["olf", "openlakeforge_services"]
branch = true

[tool.coverage.report]
# A ratchet, not a target. 81% is what the suite measured under branch coverage
# when the gate was introduced (2026-09-04, 81.07%); the number exists so a
# change cannot quietly lower it. Raise it when coverage rises -- never lower
# it to make a build pass.
#
# `--cov-config` must be passed explicitly: CI runs pytest from the repository
# root, where coverage would otherwise never find this file and would silently
# fall back to line-only coverage with no threshold at all.
fail_under = 81
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
