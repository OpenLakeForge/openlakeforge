[build-system]
requires = ["setuptools>=69"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "openlakeforge"
version = "0.3.0a1"
description = "OpenLakeForge deployment tooling: cross-environment contract, API, and artifact helpers behind the olf CLI."
requires-python = ">=3.12"
dependencies = [
  "azure-identity>=1.25,<2",
  "azure-mgmt-containerservice>=41,<42",
  "azure-mgmt-resource>=24,<25",
  "boto3>=1.34,<2",
  "jsonschema>=4.23,<5",
  "openlakeforge-domain-model==0.3.0a1",
  "python-hcl2>=6,<7",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
]

[tool.uv.sources]
openlakeforge-domain-model = { path = "../../packages/domain-model" }

[project.scripts]
olf = "olf.cli:main"

[dependency-groups]
dev = [
  "boto3-stubs>=1.43.88",
  "mypy>=1.13,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.6",
  "types-jsonschema>=4.26.0.20260518",
  "types-pyyaml>=6.0.12.20260815",
  "types-requests>=2.33.0.20260712",
]

[tool.setuptools.packages.find]
include = ["olf*"]

[tool.setuptools.package-data]
olf = ["_embedded/*.json", "_embedded/*.tar.gz"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The rendered Floe profile YAML embeds credential template lines that must
# stay byte-identical to the schema Floe expects.
"olf/floe.py" = ["E501"]
# Typer resolves repeatable options (`list[str]`) via `typer.Option(...)`
# called directly in the parameter default; that is Typer's documented API,
# not the mutable-default-argument pitfall B008 otherwise guards against.
"olf/commands/domain.py" = ["B008"]
"olf/commands/product.py" = ["B008"]
"olf/commands/source.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["olf"]
# Deliberately not `strict`. The gate's job on a 25k-line codebase that has
# never been type-checked is to stop new type errors, not to relitigate every
# existing one. Tighten by moving modules off `_BASELINE` below, not by
# flipping strict here -- that would make every module fail at once and the
# gate would be turned off within a week.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# Dagster and Floe ship no type information, and `lakehouse_code`/`libs` are
# user-project roots that are not importable from the CLI package.
[[tool.mypy.overrides]]
module = [
  "dagster.*",
  "floe_dagster.*",
  "lakehouse_code.*",
  "libs.*",
]
ignore_missing_imports = true

# _BASELINE -- the modules that already had type errors when the gate was
# introduced (26 modules, 135 errors, 2026-09-04). Every other module is
# checked and
# must stay clean. This list only ever shrinks: adding a module to it needs a
# reason in the pull request body, and removing one needs no justification at
# all. Tracked in `docs/technical-debt.md`.
[[tool.mypy.overrides]]
module = [
  "olf.auth",
  "olf.commands._shared",
  "olf.commands.artifacts",
  "olf.commands.diagnostics",
  "olf.commands.project",
  "olf.deployment.charts",
  "olf.deployment.cloud.aws",
  "olf.deployment.cloud.azure",
  "olf.deployment.context",
  "olf.deployment.contract_env",
  "olf.deployment.inspection",
  "olf.deployment.local.artifacts",
  "olf.deployment.portforward",
  "olf.e2e._health",
  "olf.e2e._layers",
  "olf.e2e._trino",
  "olf.project_code_check",
  "olf.provider_contracts",
  "olf.provider_contracts.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["olf"]
branch = true

[tool.coverage.report]
# A ratchet, not a target. 81% is what the suite measured under branch coverage
# when the gate was introduced (2026-09-04, 81.07%); the number exists so a
# change cannot quietly lower it. Raise it when coverage rises -- never lower
# it to make a build pass.
#
# `--cov-config` must be passed explicitly: CI runs pytest from the repository
# root, where coverage would otherwise never find this file and would silently
# fall back to line-only coverage with no threshold at all.
fail_under = 81
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
