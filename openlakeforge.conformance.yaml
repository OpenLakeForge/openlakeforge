# Full DEV+PROD profile for local multi-stage conformance (#155). The nightly
# (.github/workflows/local-full-e2e.yml) applies this file verbatim, so the
# topology the unit conformance suite resolves is the one rendered and
# verified at runtime (#220). 'full' enables analytics and governance in both
# stages, which the Superset and OpenMetadata assertions need; it covers
# everything a 'slim' DEV+PROD profile provisions.
apiVersion: openlakeforge.io/v1alpha1
kind: DeploymentProfile

metadata:
  name: olf-conformance

spec:
  provider:
    type: local
  preset: full
  # Declared explicitly: the nightly keeps testing the secured stack (ingress,
  # TLS, issuer, perimeter). Without these blocks a profile is a quickstart.
  # The GitHub host is the e2e stub (olf e2e starts it in olf-system), and the
  # nightly creates a dummy `github-oauth-app` Secret for Dex to read: no real
  # GitHub or OAuth App is involved (docs/setup/github-oauth-app.md).
  access: {}
  identity:
    issuer: github
    github:
      organization: OpenLakeForge
      host: olf-e2e-github.olf-system.svc
      teams:
        platform-admin: [olf-platform-admins]
        data-engineer: [olf-data-engineers]
        analyst: [olf-analysts]
        viewer: [olf-viewers]
      oauth_app_secret_ref:
        name: github-oauth-app
  stages:
    dev:
      enabled: true
    prod:
      enabled: true
