# The platform API's permission matrix (ADR 0021, decision 3), in the style of
# ADR 0014's role floors. Every route the API serves has exactly one row, keyed
# by the route's name; a route without a row is refused, never served.
#
# role:   the lowest canonical role allowed (release/identity-roles.yaml,
#         precedence); every role above it is allowed too. `anonymous` takes
#         no token at all and is for probes only.
# stages: the stages the operation applies to, for an operation that names
#         one in its path; "*" is every enabled stage. Empty: the operation
#         names no stage, and a stage in its path is refused.
# services: optional list of service principals (SERVICE_CALLERS in permissions.py) that may call the operation
#         as well, on its `stages`. A service holds no role; only a read can name one.
# changes_state: optional; the operation is audited (ADR 0021, decision 3).
# role_stages: optional inline table, role -> stage list, for a row with
#         stages. A listed role (at or above the floor) is limited to those
#         stages; a role not listed keeps `stages`. For example
#         `role_stages = { data-engineer = ["dev"] }`.

[operations.healthz]
role = "anonymous"
stages = []

[operations.whoami]
role = "viewer"
stages = []

# Dagster checks nothing itself, so these rows are the only control on what the
# API reads there. The floor is the Dagster UI route's (ADR 0014: only
# data-engineer and platform-admin have an `orchestration` grant), so the API
# shows no one a run the perimeter would not let them open in Dagster.
[operations.list_jobs]
role = "data-engineer"
stages = ["*"]

[operations.list_runs]
role = "data-engineer"
stages = ["*"]

[operations.get_run]
role = "data-engineer"
stages = ["*"]

# Health is computed from the same Dagster reads as list_runs and shows less of them (ids, statuses and times, no
# tags), so the floor is the same. Read-only and not audited, like the rows above. A deployment without
# `spec.identity` renders no issuer, so the API cannot start there and nothing here is reachable unauthenticated.
[operations.get_stage_health]
role = "data-engineer"
stages = ["*"]

# The services half of get_stage_health, with no Dagster read. `services` is the one place a service principal is
# named (ADR 0021, decision 3): the alert evaluator reads this route (ADR 0023, decision 11) and nothing else in the API.
[operations.get_stage_service_health]
role = "data-engineer"
stages = ["*"]
services = ["alert-evaluator"]

[operations.list_pipeline_health]
role = "data-engineer"
stages = ["*"]

# Resource history from the metrics backend and run series from Dagster (ADR 0024, decision 4). The API sends only
# the catalog's named series over its fixed ranges; no route takes a query. A series carries no log text or data, so
# the floor is the health routes'. Read-only and not audited.
[operations.get_stage_metric]
role = "data-engineer"
stages = ["*"]

# Nodes and olf-system components serve every stage, so the row names none.
[operations.get_platform_metric]
role = "data-engineer"
stages = []

# OpenMetadata decides these by the person's own roles on the forwarded token;
# the floor is the OpenMetadata route's (`viewer`: every recognised role reads
# it), so the API refuses no one OpenMetadata would answer.
[operations.list_domains]
role = "viewer"
stages = []

[operations.list_data_products]
role = "viewer"
stages = []

# The log archive is read with the API's own read-only key for the log prefix,
# so this row decides who reads it. Pod logs carry whatever a run printed, which
# the Dagster UI's compute logs already show at data-engineer and above. A
# data-engineer reads DEV only (ADR 0022, decision 3): the stage in the path is
# what picks the archive prefix, so this row is the whole stage boundary.
[operations.list_logs]
role = "data-engineer"
stages = ["*"]
role_stages = { data-engineer = ["dev"] }

# The first operation that changes state. Dagster checks nothing, so this row is
# the only control on who launches what. DEV only (#670): a run on another stage
# goes through Dagster's own UI and schedules until a per-stage floor is decided.
# Audited: the API acts only once it has stored a record of the attempt.
[operations.launch_run]
role = "data-engineer"
stages = ["dev"]
changes_state = true

# Superset reports, as each stage's non-admin service user (ADR 0021, open item 3).
# Import is DEV only: the service user co-owns every report asset, so an import
# here could overwrite any dashboard and bypass the repository and the artifacts
# phase; other stages take reports only from there. data-engineer, as for
# export: starting narrow is easier to loosen than to tighten.
[operations.import_report]
role = "data-engineer"
stages = ["dev"]
changes_state = true

[operations.export_report]
role = "data-engineer"
stages = ["*"]

# Trino schema and table discovery runs as the person (ADR 0019): Trino and Polaris decide what each person sees,
# so the floor is the lowest role, as for the OpenMetadata reads. The capabilities document names no stage's host.
[operations.query_capabilities]
role = "viewer"
stages = []

[operations.list_schemas]
role = "viewer"
stages = ["*"]

[operations.list_tables]
role = "viewer"
stages = ["*"]

# SQL as the person (ADR 0019): Trino and Polaris decide the data, so the floor is the lowest role, as for discovery.
# Read-only, enforced by Trino (queries.py), so none changes state and none is audited; cancel only ends the
# caller's own query. The id and cursor are signed for the person and stage, so these rows are not what binds a query.
[operations.submit_query]
role = "viewer"
stages = ["*"]

[operations.get_query]
role = "viewer"
stages = ["*"]

[operations.cancel_query]
role = "viewer"
stages = ["*"]

[operations.export_query]
role = "viewer"
stages = ["*"]

# The files explorer (#1114). The object store cannot take a person's token, so these rows are the only control on
# who reads a stage's buckets through the API's own key. platform-admin: every stage; data-engineer: dev only
# (role_stages); analyst and viewer: nothing, reads included. file_capabilities is open to every role so a client
# can ask what it may show: an analyst or viewer gets no stage back.
[operations.file_capabilities]
role = "viewer"
stages = []

[operations.list_buckets]
role = "data-engineer"
stages = ["*"]
role_stages = { data-engineer = ["dev"] }

[operations.list_objects]
role = "data-engineer"
stages = ["*"]
role_stages = { data-engineer = ["dev"] }

[operations.download_object]
role = "data-engineer"
stages = ["*"]
role_stages = { data-engineer = ["dev"] }

# The write routes take the reads' floor and per-role stages; each changes state, so each runs inside the audit.
[operations.upload_object]
role = "data-engineer"
stages = ["*"]
role_stages = { data-engineer = ["dev"] }
changes_state = true

[operations.create_folder]
role = "data-engineer"
stages = ["*"]
role_stages = { data-engineer = ["dev"] }
changes_state = true

[operations.rename_object]
role = "data-engineer"
stages = ["*"]
role_stages = { data-engineer = ["dev"] }
changes_state = true

[operations.delete_objects]
role = "data-engineer"
stages = ["*"]
role_stages = { data-engineer = ["dev"] }
changes_state = true
