# The platform API's permission matrix (ADR 0021, decision 3), in the style of
# ADR 0014's role floors. Every route the API serves has exactly one row, keyed
# by the route's name; a route without a row is refused, never served.
#
# role:   the lowest canonical role allowed (release/identity-roles.yaml,
#         precedence); every role above it is allowed too. `anonymous` takes
#         no token at all and is for probes only.
# stages: the stages the operation applies to, for an operation that names
#         one in its path; "*" is every enabled stage. Empty: the operation
#         names no stage, and a stage in its path is refused.

[operations.healthz]
role = "anonymous"
stages = []

[operations.whoami]
role = "viewer"
stages = []

# Dagster checks nothing itself, so these rows are the only control on what the
# API reads there. The floor is the Dagster UI route's (ADR 0014: only
# data-engineer and platform-admin have an `orchestration` grant), so the API
# shows no one a run the perimeter would not let them open in Dagster.
[operations.list_jobs]
role = "data-engineer"
stages = ["*"]

[operations.list_runs]
role = "data-engineer"
stages = ["*"]

[operations.get_run]
role = "data-engineer"
stages = ["*"]

# OpenMetadata decides these by the person's own roles on the forwarded token;
# the floor is the OpenMetadata route's (`viewer`: every recognised role reads
# it), so the API refuses no one OpenMetadata would answer.
[operations.list_domains]
role = "viewer"
stages = []

[operations.list_data_products]
role = "viewer"
stages = []

# The log archive is read with the API's own read-only key for the log prefix,
# so this row decides who reads it. Pod logs carry whatever a run printed, which
# the Dagster UI's compute logs already show at data-engineer and above.
[operations.list_logs]
role = "data-engineer"
stages = ["*"]

# The first operation that changes state. Dagster checks nothing, so this row is
# the only control on who launches what. DEV only (#670): a run on another stage
# goes through Dagster's own UI and schedules until a per-stage floor is decided.
# Audited: the API acts only once it has stored a record of the attempt.
[operations.launch_run]
role = "data-engineer"
stages = ["dev"]
changes_state = true
