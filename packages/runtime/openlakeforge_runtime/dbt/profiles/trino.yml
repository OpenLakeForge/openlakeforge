{{PROFILE_NAME}}:
  target: runtime
  outputs:
    runtime:
      type: trino
      # Trino takes no authentication and serves plain HTTP only (ADR 0016).
      method: none
      host: "{{ env_var('OPENLAKEFORGE_QUERY_TRINO_HOST') }}"
      port: "{{ env_var('OPENLAKEFORGE_QUERY_TRINO_PORT') | int }}"
      user: "{{ env_var('OPENLAKEFORGE_DBT_TRINO_USER') }}"
      http_scheme: http
      database: "{{ env_var('OPENLAKEFORGE_CATALOG_NAME') }}"
      schema: "{{ env_var('OPENLAKEFORGE_CATALOG_SCHEMA_PREFIX', '') }}{{GOLD_SCHEMA}}"
      # One model at a time unless the stage says otherwise. Slim's Trino has a 2G heap whose usable 70% (1.4G)
      # is smaller than two queries at the 1GB query.max-memory-per-node cap, and a single 41M-row Gold
      # rebuild already OOM-killed its coordinator (#755); see release/query-sizes.yaml. Raising it trades
      # concurrent query memory for wall time, so it is set per stage once a benchmark shows the Trino fits.
      threads: "{{ env_var('OPENLAKEFORGE_DBT_THREADS', '1') | int }}"
      # The stage's Polaris token for a keyless catalog (#967); a keyed catalog ignores it, and it
      # is empty where the catalog has no token endpoint.
      http_headers:
        X-Trino-Extra-Credential: "token={{ env_var('OPENLAKEFORGE_POLARIS_TOKEN', '') }}"
      # A Gold query reads about two stages per table, and Trino's default of
      # 150 refused a 75-table union (#706). Matches max_stage_count in
      # release/query-sizes.yaml; a lower server value still wins.
      session_properties:
        query_max_stage_count: 300
