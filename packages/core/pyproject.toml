[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openlakeforge-core"
version = "0.6.0a2"
description = "Canonical provider-neutral domain model for OpenLakeForge"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7"]

[tool.setuptools.packages.find]
include = ["openlakeforge_core*"]

# Every function in this package is annotated. Shipping the PEP 561 marker is
# what makes those annotations visible to consumers -- without it, `olf` sees
# the whole descriptor surface as `Any` and the contract boundary this package
# exists to define goes unchecked.
[tool.setuptools.package-data]
openlakeforge_core = ["py.typed"]

# Lint with the same rules as tools/olf. Ruff resolves its config per file, so a package
# without its own table would silently fall back to ruff defaults.
[tool.ruff]
extend = "../../tools/olf/pyproject.toml"
